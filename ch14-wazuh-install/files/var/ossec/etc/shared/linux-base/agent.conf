<agent_config os="Linux">
  <labels>
    <label key="role">linux-server</label>
  </labels>
  <syscheck>
    <directories whodata="yes" check_all="yes" report_changes="yes">/etc/passwd,/etc/group,/etc/sudoers,/etc/sudoers.d</directories>
    <directories whodata="yes" check_all="yes">/etc/shadow,/etc/gshadow,/etc/ssh/sshd_config,/etc/ssh/sshd_config.d</directories>
  </syscheck>
</agent_config>
