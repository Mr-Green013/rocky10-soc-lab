name: wordpress

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [backend]
    mem_limit: 512m
    pids_limit: 200

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru",
              "--save", ""]
    networks: [backend]
    mem_limit: 192m
    pids_limit: 100

  wordpress:
    image: wordpress:6-php8.3-fpm
    restart: unless-stopped
    depends_on: [db, redis]
    environment: &wpenv
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_html:/var/www/html
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: gelf
      options:
        gelf-address: "udp://192.168.10.20:12201"
        tag: "wp-php"

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on: [wordpress]
    ports: ["8081:80"]
    volumes:
      - wp_html:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - /var/log/wp-nginx:/var/log/nginx:Z
    networks: [frontend]
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: gelf
      options:
        gelf-address: "udp://192.168.10.20:12201"
        tag: "wp-nginx"

  wpcli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    depends_on: [db]
    environment: *wpenv
    volumes:
      - wp_html:/var/www/html
      - ./plugins:/plugins:ro,Z
    networks: [frontend, backend]

volumes:
  db_data: {}
  wp_html: {}

networks:
  frontend: {}
  backend:
    internal: true
