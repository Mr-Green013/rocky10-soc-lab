log_format graylog_json escape=json
  '{"log_type":"nginx_access","client_ip":"$remote_addr",'
  '"http_method":"$request_method","http_uri":"$request_uri",'
  '"http_status":$status,"http_bytes":$body_bytes_sent,'
  '"http_referer":"$http_referer","http_user_agent":"$http_user_agent",'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"http_host":"$host"}';

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 16m;

    access_log /var/log/nginx/access.log combined;     # ไฟล์สำหรับ Wazuh (EN: file for Wazuh)
    access_log /dev/stdout graylog_json;               # stdout สำหรับ GELF (EN: stdout for GELF)
    error_log  /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # LAB29-HARDENING: เปิดใช้หลังทดสอบการตรวจจับใน Lab 29 (EN: enable after testing the detection in Lab 29)
    # location ~* ^/wp-content/uploads/.*\.ph(p\d?|tml|ar)$ { deny all; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wordpress:9000;
    }

    location ~ /\.(ht|git|env) { deny all; }
}
