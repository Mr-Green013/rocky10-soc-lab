# ส่ง audit event ไป Graylog ด้วย action ของไฟล์นี้ แล้ว stop เพื่อไม่ให้เขียนลง /var/log/messages
if $programname == 'audisp-syslog' then {
    action(type="omfwd" target="192.168.10.20" port="1514" protocol="tcp"
           template="RSYSLOG_SyslogProtocol23Format"
           queue.type="LinkedList" queue.filename="graylog_audit" queue.maxDiskSpace="1g"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
    stop
}
