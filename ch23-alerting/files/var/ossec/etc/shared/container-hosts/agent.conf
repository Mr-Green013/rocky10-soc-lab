<agent_config>
  <labels>
    <label key="role">container-host</label>
  </labels>

  <wodle name="docker-listener">
    <disabled>no</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/falco.json</location>
    <label key="integration">falco</label>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/tetragon/tetragon.log</location>
    <label key="integration">tetragon</label>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/web-01/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/web-01/error.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/wp-nginx/access.log</location>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes">/var/lib/docker/volumes/wordpress_wp_html/_data/wp-content/uploads</directories>
  </syscheck>
</agent_config>
