<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>How CrowdSec decisions travel into Graylog</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">How CrowdSec decisions travel into Graylog</text><polyline points="260,180 300,180" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="540,180 580,180" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="830,180 870,180" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1100,180 1140,180" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1255,250 1255,310" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="110" width="230" height="140" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="142" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">alert</text><text x="48" y="170" font-size="16" fill="#33475B" text-anchor="start">crowdsecurity/ssh-bf</text><text x="48" y="195" font-size="16" fill="#33475B" text-anchor="start">IP 192.168.10.42</text><rect x="300" y="100" width="240" height="165" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="318" y="132" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">profiles.yaml</text><text x="318" y="160" font-size="16" fill="#33475B" text-anchor="start">default_ip_remediation</text><text x="318" y="185" font-size="16" fill="#33475B" text-anchor="start">ban 4h</text><text x="318" y="210" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">notifications:</text><text x="318" y="235" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">  - http_graylog</text><rect x="580" y="110" width="250" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="598" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">http_graylog</text><text x="598" y="170" font-size="16" fill="#33475B" text-anchor="start">Go template</text><text x="598" y="195" font-size="16" fill="#33475B" text-anchor="start">→ GELF JSON</text><text x="598" y="220" font-size="16" fill="#33475B" text-anchor="start">POST /gelf</text><rect x="870" y="110" width="230" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="888" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">gelf-http-12201</text><text x="888" y="170" font-size="16" fill="#33475B" text-anchor="start">Graylog Input</text><text x="888" y="195" font-size="16" fill="#33475B" text-anchor="start">fields ready to use</text><rect x="1140" y="110" width="230" height="140" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1158" y="142" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">suspicious-ip</text><text x="1158" y="170" font-size="16" fill="#FFFFFF" text-anchor="start">rule: has field</text><text x="1158" y="195" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">cs_scenario</text><rect x="300" y="310" width="530" height="120" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="318" y="342" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">decisions that do not match a profile</text><text x="318" y="370" font-size="16" fill="#33475B" text-anchor="start">cscli decisions import (Tor list, chapter 9) creates no notification</text><text x="318" y="395" font-size="16" fill="#33475B" text-anchor="start">so the script sends a logger message with the number imported</text><rect x="1140" y="310" width="230" height="120" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1158" y="342" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">dashboard</text><text x="1158" y="370" font-size="16" fill="#33475B" text-anchor="start">SOC - CrowdSec</text><text x="1158" y="395" font-size="16" fill="#33475B" text-anchor="start">Remediation</text></svg>
