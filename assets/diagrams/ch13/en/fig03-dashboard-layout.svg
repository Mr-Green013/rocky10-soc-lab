<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Layout of SOC - Global Threat Intelligence</title>
