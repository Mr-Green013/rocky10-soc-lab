<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ลำดับ Message Processors ที่ทำให้ field GeoIP เกิด</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="450" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ลำดับ Message Processors ที่ทำให้ field GeoIP เกิด</text><polyline points="330,170 380,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="680,170 730,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1030,170 1080,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="100" width="300" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="132" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">1. Message Filter Chain</text><text x="48" y="160" font-size="16"  fill="#33475B" text-anchor="start">stream rules</text><text x="48" y="185" font-size="16"  fill="#33475B" text-anchor="start">ข้อความเข้า auth-logs</text><rect x="380" y="100" width="300" height="140" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="398" y="132" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">2. Pipeline Processor</text><text x="398" y="160" font-size="16"  fill="#33475B" text-anchor="start">SOC-SSH สร้าง</text><text x="398" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">src_ip</text><rect x="730" y="100" width="300" height="140" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="748" y="132" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">3. GeoIP Resolver</text><text x="748" y="160" font-size="16"  fill="#33475B" text-anchor="start">อ่าน src_ip และ cs_ip</text><text x="748" y="185" font-size="16"  fill="#33475B" text-anchor="start">MaxMind City + ASN</text><rect x="1080" y="100" width="290" height="140" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1098" y="132" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">field ใหม่</text><text x="1098" y="160" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">src_ip_country_code</text><text x="1098" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">src_ip_geolocation</text><text x="1098" y="210" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">src_ip_as_organization</text><rect x="380" y="300" width="650" height="110" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="398" y="332" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">ถ้า GeoIP อยู่ก่อน Pipeline</text><text x="398" y="360" font-size="16"  fill="#FFFFFF" text-anchor="start">ตอนที่ GeoIP ทำงาน src_ip ยังไม่มี → ไม่มี field ใหม่และไม่มี error เตือน</text></svg>
