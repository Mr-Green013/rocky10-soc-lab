<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>agent ตั้งแต่ติดตั้งจนรับ configuration ของกลุ่ม</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="400" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">agent ตั้งแต่ติดตั้งจนรับ configuration ของกลุ่ม</text><polyline points="330,185 370,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="670,185 710,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1010,185 1050,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="100" width="300" height="170" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="132" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">1. ติดตั้ง</text><text x="48" y="160" font-size="16"  fill="#33475B" text-anchor="start">WAZUH_MANAGER</text><text x="48" y="185" font-size="16"  fill="#33475B" text-anchor="start">WAZUH_AGENT_NAME</text><text x="48" y="210" font-size="16"  fill="#33475B" text-anchor="start">WAZUH_AGENT_GROUP</text><rect x="370" y="100" width="300" height="170" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="388" y="132" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">2. enroll (1515)</text><text x="388" y="160" font-size="16"  fill="#33475B" text-anchor="start">รับ key ประจำตัว</text><text x="388" y="185" font-size="16"  fill="#33475B" text-anchor="start">client.keys</text><text x="388" y="210" font-size="16"  fill="#33475B" text-anchor="start">ชื่อซ้ำ = ถูกปฏิเสธ</text><rect x="710" y="100" width="300" height="170" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="728" y="132" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">3. connect (1514)</text><text x="728" y="160" font-size="16"  fill="#33475B" text-anchor="start">event เข้ารหัส</text><text x="728" y="185" font-size="16"  fill="#33475B" text-anchor="start">keepalive</text><text x="728" y="210" font-size="16"  fill="#33475B" text-anchor="start">สถานะ Active</text><rect x="1050" y="100" width="320" height="170" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1068" y="132" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">4. รับ config กลุ่ม</text><text x="1068" y="160" font-size="16"  fill="#33475B" text-anchor="start">shared/agent.conf</text><text x="1068" y="185" font-size="16"  fill="#33475B" text-anchor="start">รวมกับ ossec.conf</text><text x="1068" y="210" font-size="16"  fill="#33475B" text-anchor="start">กลุ่มหลังมีลำดับสูงกว่า</text><text x="700" y="330" font-size="17" fill="#C0392B" text-anchor="middle">VM ที่ clone มาจากเครื่องที่ enroll แล้วจะติด key เดิม ต้องลบ client.keys และลงทะเบียนใหม่</text></svg>
