<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>แผน agent group ของ lab</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">แผน agent group ของ lab</text><polyline points="310,200 380,125" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="310,235 380,255" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="310,270 380,385" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="840,125 910,200" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="840,255 910,255" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="840,385 910,290" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="150" width="280" height="170" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="182" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">manager</text><text x="48" y="210" font-size="16"  fill="#FFFFFF" text-anchor="start">/var/ossec/etc/shared/</text><text x="48" y="235" font-size="16"  fill="#FFFFFF" text-anchor="start">&lt;กลุ่ม&gt;/agent.conf</text><text x="48" y="260" font-size="16"  fill="#FFFFFF" text-anchor="start">verify-agent-conf</text><rect x="380" y="70" width="460" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="398" y="102" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">linux-base (ทุกเครื่อง)</text><text x="398" y="130" font-size="16"  fill="#33475B" text-anchor="start">label role · FIM whodata ไฟล์บัญชี, sudoers, sshd_config</text><rect x="380" y="200" width="460" height="110" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="398" y="232" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">container-hosts (node-01)</text><text x="398" y="260" font-size="16"  fill="#33475B" text-anchor="start">label role → เติม Docker, Falco, Tetragon ในบทที่ 23</text><rect x="380" y="330" width="460" height="110" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="398" y="362" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">file-servers (lab-linux-02)</text><text x="398" y="390" font-size="16"  fill="#33475B" text-anchor="start">label role → เติม log ของ Samba ในบทที่ 23</text><rect x="910" y="150" width="460" height="170" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="928" y="182" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">Graylog</text><text x="928" y="210" font-size="16"  fill="#33475B" text-anchor="start">field wazuh_agent_role</text><text x="928" y="235" font-size="16"  fill="#33475B" text-anchor="start">กรอง dashboard ตามหน้าที่</text><text x="928" y="260" font-size="16"  fill="#33475B" text-anchor="start">ไม่ต้องพิมพ์ชื่อเครื่อง</text></svg>
