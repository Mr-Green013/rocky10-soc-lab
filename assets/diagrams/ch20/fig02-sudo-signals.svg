<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>จาก log ของ sudo สู่ dashboard และ event</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="430" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">จาก log ของ sudo สู่ dashboard และ event</text><polyline points="350,255 450,255" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="350,370 630,370 630,325" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="350,140 910,140" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="810,240 910,200" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="810,300 910,320" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="90" width="320" height="100" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="48" y="122" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">100210 สำเร็จ</text><text x="48" y="150" font-size="16"  fill="#33475B" text-anchor="start">aod: systemctl status sshd</text><rect x="30" y="205" width="320" height="100" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="237" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">100211 ไม่มีสิทธิ์คำสั่งนี้</text><text x="48" y="265" font-size="16"  fill="#33475B" text-anchor="start">anan: cat /etc/shadow</text><rect x="30" y="320" width="320" height="100" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="352" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">100212 ไม่อยู่ใน sudoers</text><text x="48" y="380" font-size="16"  fill="#33475B" text-anchor="start">chai: id</text><rect x="450" y="205" width="360" height="120" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="468" y="237" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">100213 ทำซ้ำ</text><text x="468" y="265" font-size="16"  fill="#FFFFFF" text-anchor="start">frequency 3 ใน 600 วินาที</text><text x="468" y="290" font-size="16"  fill="#FFFFFF" text-anchor="start">same_field srcuser</text><rect x="910" y="90" width="460" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="928" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Dashboard Sudo Access Violation</text><text x="928" y="150" font-size="16"  fill="#33475B" text-anchor="start">ใคร · เครื่องไหน · คำสั่งอะไร</text><text x="928" y="175" font-size="16"  fill="#33475B" text-anchor="start">สำเร็จเทียบกับถูกปฏิเสธรายคน</text><rect x="910" y="270" width="460" height="120" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="928" y="302" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Event Definition</text><text x="928" y="330" font-size="16"  fill="#FFFFFF" text-anchor="start">Sudo violation: repeat offender</text><text x="928" y="355" font-size="16"  fill="#FFFFFF" text-anchor="start">field violator = srcuser</text></svg>
