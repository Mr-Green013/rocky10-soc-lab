<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>analyst1 login Graylog ด้วยบัญชี FreeIPA</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker></defs>
<rect width="1400" height="520" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">analyst1 login Graylog ด้วยบัญชี FreeIPA</text><polyline points="230,240 290,240" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="620,190 720,130" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="670" y="150" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">LDAPS 636</text><polyline points="620,260 720,270" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="620,300 720,405" fill="none" stroke="#C0392B" stroke-width="3"  marker-end="url(#m-red)"/><rect x="30" y="180" width="200" height="120" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="130" y="232.65" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">analyst1</text><text x="130" y="260.65" font-size="16"  fill="#FFFFFF" text-anchor="middle">browser · HTTPS</text><rect x="290" y="150" width="330" height="180" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="308" y="182" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Graylog</text><text x="308" y="210" font-size="16"  fill="#33475B" text-anchor="start">Authentication Service: LDAP</text><text x="308" y="235" font-size="16"  fill="#33475B" text-anchor="start">truststore มี CA ของ IPA</text><text x="308" y="260" font-size="16"  fill="#33475B" text-anchor="start">Default Role: Reader</text><rect x="720" y="70" width="650" height="120" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="738" y="102" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">1. ค้นหาด้วย bind account (อ่านอย่างเดียว)</text><text x="738" y="130" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">(&amp;(objectClass=posixAccount)(uid={0})</text><text x="738" y="155" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">  (memberOf=cn=soc-analysts,cn=groups,...))</text><rect x="720" y="220" width="650" height="100" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="738" y="252" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">2. พบ → bind ด้วย DN ของผู้ใช้และรหัสที่กรอก</text><text x="738" y="280" font-size="16"  fill="#33475B" text-anchor="start">ผ่าน → สร้าง/อัปเดตผู้ใช้ใน Graylog</text><rect x="720" y="350" width="650" height="110" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="738" y="382" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">ไม่พบ (intern1 ไม่อยู่ในกลุ่ม) → ปฏิเสธ</text><text x="738" y="410" font-size="16"  fill="#FFFFFF" text-anchor="start">ถอดออกจากกลุ่ม → login ครั้งถัดไปไม่ได้</text><text x="738" y="435" font-size="16"  fill="#FFFFFF" text-anchor="start">session ที่เปิดอยู่ใช้ได้จนหมด timeout</text></svg>
