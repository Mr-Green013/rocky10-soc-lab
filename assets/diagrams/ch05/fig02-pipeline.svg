<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Pipeline: Top 10 IP ที่ login ล้มเหลว (หัวข้อ 9.8)</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="430" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Pipeline: Top 10 IP ที่ login ล้มเหลว (หัวข้อ 9.8)</text><polyline points="220,170 260,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="240" y="160" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">stdin</text><polyline points="450,170 490,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="470" y="160" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">|</text><polyline points="680,170 720,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="700" y="160" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">|</text><polyline points="890,170 930,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="910" y="160" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">|</text><polyline points="1120,170 1160,170" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="1140" y="160" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">|</text><rect x="30" y="110" width="190" height="120" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="48" y="142" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">/var/log/secure</text><text x="48" y="170" font-size="14"  fill="#33475B" text-anchor="start">ทุกบรรทัดของ</text><text x="48" y="195" font-size="14"  fill="#33475B" text-anchor="start">การยืนยันตัวตน</text><rect x="260" y="110" width="190" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="278" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">grep</text><text x="278" y="170" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">Failed password</text><text x="278" y="195" font-size="14"  fill="#33475B" text-anchor="start">เหลือเฉพาะที่ล้มเหลว</text><rect x="490" y="110" width="190" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="508" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">grep -oE</text><text x="508" y="170" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">from [0-9.]+</text><text x="508" y="195" font-size="14"  fill="#33475B" text-anchor="start">ตัดเหลือ "from IP"</text><rect x="720" y="110" width="170" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="738" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">awk</text><text x="738" y="170" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">{print $2}</text><text x="738" y="195" font-size="14"  fill="#33475B" text-anchor="start">เหลือแค่ IP</text><rect x="930" y="110" width="190" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="948" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">sort | uniq -c</text><text x="948" y="170" font-size="14"  fill="#33475B" text-anchor="start">จัดกลุ่ม</text><text x="948" y="195" font-size="14"  fill="#33475B" text-anchor="start">นับซ้ำต่อ IP</text><rect x="1160" y="110" width="210" height="120" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1178" y="142" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">sort -rn | head</text><text x="1178" y="170" font-size="14"  fill="#33475B" text-anchor="start">เรียงมากไปน้อย</text><text x="1178" y="195" font-size="14"  fill="#33475B" text-anchor="start">10 อันดับแรก</text><rect x="520" y="300" width="380" height="80" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="538" y="332" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">stderr (2) ไม่ไหลเข้า pipe</text><text x="538" y="360" font-size="15"  fill="#33475B" text-anchor="start">ใช้ 2&gt;/dev/null หรือ 2&gt;&amp;1 กำหนดเอง</text></svg>
