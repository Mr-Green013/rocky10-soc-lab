<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ใครเป็นผู้เปิดไฟล์ปลายทาง</title>
<defs><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1E7D3A"/></marker><marker id="m-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#8A96A3"/></marker></defs>
<rect width="1400" height="420" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ใครเป็นผู้เปิดไฟล์ปลายทาง</text><rect x="30" y="80" width="650" height="300" rx="14" fill="none" stroke="#E76F51" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="108" font-size="17" font-weight="700" fill="#B5462B">sudo echo test &gt; /etc/lab.conf</text><rect x="720" y="80" width="650" height="300" rx="14" fill="none" stroke="#1E7D3A" stroke-width="2" stroke-dasharray="8 6"/><text x="736" y="108" font-size="17" font-weight="700" fill="#1E7D3A">echo test | sudo tee /etc/lab.conf</text><polyline points="320,185 380,185" fill="none" stroke="#C0392B" stroke-width="3"  marker-end="url(#m-red)"/><polyline points="1010,185 1080,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="1045" y="175" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">pipe</text><polyline points="1210,230 1210,270" fill="none" stroke="#1E7D3A" stroke-width="3"  marker-end="url(#m-green)"/><polyline points="190,230 190,270" fill="none" stroke="#8A96A3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-gray)"/><rect x="60" y="140" width="260" height="90" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="78" y="172" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">bash ของ aod</text><text x="78" y="200" font-size="16"  fill="#33475B" text-anchor="start">เปิด /etc/lab.conf ก่อน</text><rect x="380" y="140" width="270" height="90" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="398" y="172" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Permission denied</text><text x="398" y="200" font-size="16"  fill="#FFFFFF" text-anchor="start">sudo ยังไม่ได้เริ่มเลย</text><rect x="60" y="270" width="260" height="80" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="78" y="302" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">sudo echo</text><text x="78" y="330" font-size="16"  fill="#33475B" text-anchor="start">ไม่เคยถูกรัน</text><rect x="750" y="140" width="260" height="90" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="768" y="172" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">bash ของ aod</text><text x="768" y="200" font-size="16"  fill="#33475B" text-anchor="start">ส่ง "test" เข้า pipe</text><rect x="1080" y="140" width="260" height="90" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1098" y="172" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">sudo tee (root)</text><text x="1098" y="200" font-size="16"  fill="#33475B" text-anchor="start">เปิดไฟล์ด้วยสิทธิ์ root</text><rect x="1080" y="270" width="260" height="80" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="1098" y="302" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">/etc/lab.conf</text><text x="1098" y="330" font-size="16"  fill="#33475B" text-anchor="start">เขียนสำเร็จ</text></svg>
