<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Locations to know in the filesystem</title>
<defs><marker id="m-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#8A96A3"/></marker></defs>
<rect width="1400" height="560" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Locations to know in the filesystem</text><polyline points="700,126 700,158 165,158 165,190" fill="none" stroke="#8A96A3" stroke-width="2" marker-end="url(#m-gray)"/><polyline points="700,126 700,158 435,158 435,190" fill="none" stroke="#8A96A3" stroke-width="2" marker-end="url(#m-gray)"/><polyline points="700,126 700,158 705,158 705,190" fill="none" stroke="#8A96A3" stroke-width="2" marker-end="url(#m-gray)"/><polyline points="700,126 700,158 975,158 975,190" fill="none" stroke="#8A96A3" stroke-width="2" marker-end="url(#m-gray)"/><polyline points="700,126 700,158 1240,158 1240,190" fill="none" stroke="#8A96A3" stroke-width="2" marker-end="url(#m-gray)"/><rect x="620" y="70" width="160" height="56" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="700" y="102" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">/</text><rect x="40" y="190" width="250" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="58" y="222" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">/etc</text><text x="58" y="250" font-size="16" fill="#33475B" text-anchor="start">system and service config</text><text x="58" y="275" font-size="16" fill="#33475B" text-anchor="start">passwd, shadow, sudoers</text><text x="58" y="300" font-size="16" fill="#33475B" text-anchor="start">ssh/, cron.d/, systemd/</text><rect x="310" y="190" width="250" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="328" y="222" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">/var/log</text><text x="328" y="250" font-size="16" fill="#33475B" text-anchor="start">file-based evidence</text><text x="328" y="275" font-size="16" fill="#33475B" text-anchor="start">secure, messages</text><text x="328" y="300" font-size="16" fill="#33475B" text-anchor="start">audit/audit.log</text><rect x="580" y="190" width="250" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="598" y="222" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">/usr/bin, /usr/sbin</text><text x="598" y="250" font-size="16" fill="#33475B" text-anchor="start">system binaries</text><text x="598" y="275" font-size="16" fill="#33475B" text-anchor="start">/bin is a symlink to here</text><text x="598" y="300" font-size="16" fill="#33475B" text-anchor="start">replaced = binary tampering</text><rect x="850" y="190" width="250" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="868" y="222" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">/tmp, /dev/shm</text><text x="868" y="250" font-size="16" fill="#33475B" text-anchor="start">world-writable (sticky bit)</text><text x="868" y="275" font-size="16" fill="#33475B" text-anchor="start">where attackers drop files</text><text x="868" y="300" font-size="16" fill="#33475B" text-anchor="start">check in every investigation</text><rect x="1120" y="190" width="240" height="150" rx="12" fill="#F3EEF8" stroke="#7B4FA0" stroke-width="2"/><text x="1138" y="222" font-size="19" font-weight="700" fill="#5E3A80" text-anchor="start">/proc, /sys</text><text x="1138" y="250" font-size="16" fill="#33475B" text-anchor="start">live data from the kernel</text><text x="1138" y="275" font-size="16" fill="#33475B" text-anchor="start">process, network, module</text><text x="1138" y="300" font-size="16" fill="#33475B" text-anchor="start">gone after reboot</text><rect x="175" y="400" width="300" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="193" y="432" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">/home, /root</text><text x="193" y="460" font-size="16" fill="#33475B" text-anchor="start">~/.ssh/authorized_keys</text><text x="193" y="485" font-size="16" fill="#33475B" text-anchor="start">~/.bash_history</text><rect x="525" y="400" width="330" height="110" rx="12" fill="#FFF8DC" stroke="#C9A227" stroke-width="2"/><text x="543" y="432" font-size="19" font-weight="700" fill="#7A5B00" text-anchor="start">/usr/local/bin</text><text x="543" y="460" font-size="16" fill="#33475B" text-anchor="start">scripts the admin wrote</text><text x="543" y="485" font-size="16" fill="#33475B" text-anchor="start">before /usr/bin in PATH</text><rect x="905" y="400" width="330" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="923" y="432" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">/var/ossec</text><text x="923" y="460" font-size="16" fill="#33475B" text-anchor="start">Wazuh agent and manager</text><text x="923" y="485" font-size="16" fill="#33475B" text-anchor="start">from chapter 14</text></svg>
