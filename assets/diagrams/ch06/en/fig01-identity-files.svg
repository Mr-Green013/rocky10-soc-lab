<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Identity files and who reads them</title>
<defs><marker id="m-teal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2A9D8F"/></marker><marker id="m-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#8A96A3"/></marker></defs>
<rect width="1400" height="560" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Identity files and who reads them</text><polyline points="650,165 760,165" fill="none" stroke="#2A9D8F" stroke-width="3" marker-end="url(#m-teal)"/><text x="705" y="155" font-size="15" text-anchor="middle" fill="#2A9D8F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">passwd + group</text><polyline points="650,345 760,345" fill="none" stroke="#2A9D8F" stroke-width="3" marker-end="url(#m-teal)"/><text x="705" y="335" font-size="15" text-anchor="middle" fill="#2A9D8F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">shadow (root)</text><polyline points="1100,300 1040,300" fill="none" stroke="#8A96A3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-gray)"/><rect x="40" y="90" width="300" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="58" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">/etc/passwd</text><text x="58" y="150" font-size="16" fill="#33475B" text-anchor="start">mode 644, everyone can read</text><text x="58" y="175" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">aod:x:1000:1000:...</text><text x="58" y="200" font-size="16" fill="#33475B" text-anchor="start">name, UID, GID, home, shell</text><rect x="40" y="270" width="300" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="58" y="302" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">/etc/shadow</text><text x="58" y="330" font-size="16" fill="#33475B" text-anchor="start">mode 000, only root can read</text><text x="58" y="355" font-size="16" fill="#33475B" text-anchor="start">password hash ($y$)</text><text x="58" y="380" font-size="16" fill="#33475B" text-anchor="start">password age, account expiry</text><rect x="370" y="90" width="280" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="388" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">/etc/group</text><text x="388" y="150" font-size="16" fill="#33475B" text-anchor="start">mode 644</text><text x="388" y="175" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">wheel:x:10:aod</text><text x="388" y="200" font-size="16" fill="#33475B" text-anchor="start">members of supplementary groups</text><rect x="370" y="270" width="280" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="388" y="302" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">/etc/gshadow</text><text x="388" y="330" font-size="16" fill="#33475B" text-anchor="start">mode 000</text><text x="388" y="355" font-size="16" fill="#33475B" text-anchor="start">passwords and admins</text><text x="388" y="380" font-size="16" fill="#33475B" text-anchor="start">of the group</text><rect x="760" y="90" width="280" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="778" y="122" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">NSS (getent, ls, id)</text><text x="778" y="150" font-size="16" fill="#33475B" text-anchor="start">name ↔ UID/GID lookup</text><text x="778" y="175" font-size="16" fill="#33475B" text-anchor="start">order in nsswitch.conf</text><text x="778" y="200" font-size="16" fill="#33475B" text-anchor="start">files → sss (chapter 7)</text><rect x="760" y="270" width="280" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="778" y="302" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">PAM (login, sshd, sudo)</text><text x="778" y="330" font-size="16" fill="#33475B" text-anchor="start">checks the password against shadow</text><text x="778" y="355" font-size="16" fill="#33475B" text-anchor="start">checks aging and locks</text><text x="778" y="380" font-size="16" fill="#33475B" text-anchor="start">pam_unix.so</text><rect x="1100" y="180" width="260" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="1118" y="212" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">/etc/login.defs</text><text x="1118" y="240" font-size="16" fill="#33475B" text-anchor="start">useradd defaults</text><text x="1118" y="265" font-size="16" fill="#33475B" text-anchor="start">UID_MIN, PASS_MAX_DAYS</text><text x="1118" y="290" font-size="16" fill="#33475B" text-anchor="start">ENCRYPT_METHOD</text><rect x="40" y="460" width="1320" height="70" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="700" y="498" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Any account with UID = 0 is root, whatever its name  ·  awk -F: '$3==0' /etc/passwd must show only root</text></svg>
