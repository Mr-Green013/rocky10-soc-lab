<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>The sshd PAM stack after this chapter (files authselect generates)</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#8A96A3"/></marker></defs>
<rect width="1400" height="520" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">The sshd PAM stack after this chapter (files authselect generates)</text><polyline points="240,260 270,260 270,122.5 300,122.5" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="240,232.5 300,232.5" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="240,300 300,300" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="240,260 270,260 270,422.5 300,422.5" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="860,122.5 800,122.5" fill="none" stroke="#8A96A3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-gray)"/><polyline points="860,222.5 800,222.5" fill="none" stroke="#8A96A3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-gray)"/><polyline points="860,322.5 800,322.5" fill="none" stroke="#8A96A3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-gray)"/><polyline points="860,422.5 800,422.5" fill="none" stroke="#8A96A3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-gray)"/><rect x="40" y="200" width="200" height="120" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="140" y="252.65" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">sshd / passwd</text><text x="140" y="280.65" font-size="16" fill="#FFFFFF" text-anchor="middle">calls PAM</text><rect x="300" y="80" width="500" height="85" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="318" y="112" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">auth: who are you</text><text x="318" y="140" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">pam_faillock preauth → pam_unix → pam_faillock authfail</text><rect x="300" y="180" width="500" height="85" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="318" y="212" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">account: may you log in now</text><text x="318" y="240" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">pam_unix (account expired?) → pam_faillock (locked?)</text><rect x="300" y="280" width="500" height="85" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="318" y="312" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">password: how the password changes</text><text x="318" y="340" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">pam_pwquality → pam_pwhistory → pam_unix</text><rect x="300" y="380" width="500" height="85" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="318" y="412" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">session: open/close the session</text><text x="318" y="440" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">pam_limits → pam_systemd → pam_unix</text><rect x="860" y="80" width="500" height="85" rx="12" fill="#FFF8DC" stroke="#C9A227" stroke-width="2"/><text x="878" y="112" font-size="19" font-weight="700" fill="#7A5B00" text-anchor="start">faillock.conf</text><text x="878" y="140" font-size="15" fill="#33475B" text-anchor="start">deny = 5, unlock_time = 900 (topic 6.3.1)</text><rect x="860" y="180" width="500" height="85" rx="12" fill="#FFF8DC" stroke="#C9A227" stroke-width="2"/><text x="878" y="212" font-size="19" font-weight="700" fill="#7A5B00" text-anchor="start">shadow field 8 (account expire)</text><text x="878" y="240" font-size="15" fill="#33475B" text-anchor="start">usermod -e 1 disables the account (10.10)</text><rect x="860" y="280" width="500" height="85" rx="12" fill="#FFF8DC" stroke="#C9A227" stroke-width="2"/><text x="878" y="312" font-size="19" font-weight="700" fill="#7A5B00" text-anchor="start">pwquality.conf.d + pwhistory.conf</text><text x="878" y="340" font-size="15" fill="#33475B" text-anchor="start">minlen 14, minclass 3, remember 5 (10.4)</text><rect x="860" y="380" width="500" height="85" rx="12" fill="#FFF8DC" stroke="#C9A227" stroke-width="2"/><text x="878" y="412" font-size="19" font-weight="700" fill="#7A5B00" text-anchor="start">limits.d (chapter 8)</text><text x="878" y="440" font-size="15" fill="#33475B" text-anchor="start">maxlogins limits the number of sessions</text></svg>
