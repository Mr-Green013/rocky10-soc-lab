<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>The account lifecycle and the commands used at each stage</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1E7D3A"/></marker><marker id="m-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#E76F51"/></marker></defs>
<rect width="1400" height="400" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">The account lifecycle and the commands used at each stage</text><polyline points="250,185 300,185" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="520,185 630,185" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="575" y="175" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">after 90 days</text><polyline points="740,260 740,320 410,320 410,260" fill="none" stroke="#1E7D3A" stroke-width="3" marker-end="url(#m-green)"/><text x="575" y="310" font-size="15" text-anchor="middle" fill="#1E7D3A" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">change password</text><polyline points="410,110 410,80 1025,80 1025,110" fill="none" stroke="#E76F51" stroke-width="3" marker-end="url(#m-orange)"/><text x="717.5" y="70" font-size="15" text-anchor="middle" fill="#E76F51" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">leaves / compromised</text><polyline points="1150,185 1190,185" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="110" width="220" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">create</text><text x="48" y="170" font-size="16" fill="#33475B" text-anchor="start">add-users.sh (10.3)</text><text x="48" y="195" font-size="16" fill="#33475B" text-anchor="start">random password each</text><text x="48" y="220" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">chage -d 0</text><rect x="300" y="110" width="220" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="318" y="142" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">in use</text><text x="318" y="170" font-size="16" fill="#33475B" text-anchor="start">aging 90/1/14 days</text><text x="318" y="195" font-size="16" fill="#33475B" text-anchor="start">history of 5 passwords</text><text x="318" y="220" font-size="16" fill="#33475B" text-anchor="start">faillock after 5 tries</text><rect x="630" y="110" width="220" height="150" rx="12" fill="#FFF8DC" stroke="#C9A227" stroke-width="2"/><text x="648" y="142" font-size="19" font-weight="700" fill="#7A5B00" text-anchor="start">password expired</text><text x="648" y="170" font-size="16" fill="#33475B" text-anchor="start">must change at login</text><text x="648" y="195" font-size="16" fill="#33475B" text-anchor="start">grace -I 30 days</text><text x="648" y="220" font-size="16" fill="#33475B" text-anchor="start">then locked</text><rect x="900" y="110" width="250" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="918" y="142" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">Offboard (10.10)</text><text x="918" y="170" font-size="16" fill="#33475B" text-anchor="start">-L, nologin, -e 1</text><text x="918" y="195" font-size="16" fill="#33475B" text-anchor="start">remove keys, cron, sessions</text><text x="918" y="220" font-size="16" fill="#33475B" text-anchor="start">keep the file list</text><rect x="1190" y="110" width="190" height="150" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1208" y="142" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">delete</text><text x="1208" y="170" font-size="16" fill="#FFFFFF" text-anchor="start">after retention ends</text><text x="1208" y="195" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">userdel -r</text><text x="700" y="375" font-size="16" fill="#5B6770" text-anchor="middle">Offboarding can last months; a disabled account still owns its files and shows up correctly in logs</text></svg>
