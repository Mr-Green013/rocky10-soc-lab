<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
  <title>Figure 2-2 The order in which sshd reads config, and the effective values</title>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1F3A5F"/></marker></defs>
  <rect width="1400" height="590" fill="#fff"/>
  <g font-size="17" fill="#33475B">
    <rect x="40" y="40" width="380" height="220" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/>
    <text x="60" y="76" font-size="20" font-weight="700" fill="#1F3A5F">/etc/ssh/sshd_config</text>
    <text x="60" y="110" font-family="monospace" font-size="15">Include /etc/ssh/sshd_config.d/*.conf</text>
    <text x="60" y="140">this line is at the top of the file, so files in .d are</text>
    <text x="60" y="166">read before the values in the main file</text>
    <text x="60" y="206">do not edit this file directly: dnf update</text>
    <text x="60" y="232">may replace it with a .rpmnew file</text>
    <rect x="490" y="40" width="460" height="360" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/>
    <text x="510" y="76" font-size="20" font-weight="700" fill="#1F3A5F">sshd_config.d/*.conf sorted by name</text>
    <g font-family="monospace" font-size="15">
      <text x="510" y="112">01-soclab-auth.conf      (chapter 8)</text>
      <text x="510" y="138">04-ipa.conf              (chapter 7)</text>
      <text x="510" y="164">05-soclab-baseline.conf  (Azure only)</text>
      <text x="510" y="190">10-port.conf             (chapter 4 mini-lab)</text>
      <text x="510" y="216">20-session-limit.conf    (chapter 8)</text>
      <text x="510" y="242">50-cloud-init.conf       (chapter 1)</text>
      <text x="510" y="268">50-redhat.conf           (ships with Rocky)</text>
    </g>
    <text x="510" y="314">lower numbers are read first, and for most keywords</text>
    <text x="510" y="340"><tspan font-weight="700" fill="#C0392B">the first value found is used;</tspan> later duplicates are ignored</text>
    <text x="510" y="374">so our files start with low numbers</text>
    <rect x="1020" y="40" width="340" height="220" rx="12" fill="#1F3A5F"/>
    <text x="1040" y="76" font-size="20" font-weight="700" fill="#fff">sudo sshd -T</text>
    <text x="1040" y="110" fill="#DCE6F2">prints the effective values after merging</text>
    <text x="1040" y="136" fill="#DCE6F2">all files; use it to check every time</text>
    <text x="1040" y="176" font-family="monospace" font-size="15" fill="#F2CC60">passwordauthentication no</text>
    <text x="1040" y="204" font-family="monospace" font-size="15" fill="#F2CC60">permitrootlogin without-password</text>
    <text x="1040" y="232" font-family="monospace" font-size="15" fill="#F2CC60">port 22</text>
  </g>
  <g stroke="#1F3A5F" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="422" y1="110" x2="486" y2="110"/><line x1="952" y1="150" x2="1016" y2="150"/>
  </g>
  <rect x="40" y="440" width="1320" height="110" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/>
  <text x="60" y="476" font-size="20" font-weight="700" fill="#1F3A5F">3 rules every time you change SSH</text>
  <text x="60" y="510" font-size="17" fill="#33475B">1) keep a second session open   2) sudo sshd -t must print nothing   3) sudo systemctl reload sshd (open sessions stay up)</text>
  <text x="60" y="538" font-size="16" fill="#5B6770">Locked out? Use the VM console in Proxmox, which does not go through SSH</text>
</svg>
