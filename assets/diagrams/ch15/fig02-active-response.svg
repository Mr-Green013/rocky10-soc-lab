<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Active Response firewall-drop จาก alert ถึงการถอนกฎ</text><polyline points="280,175 330,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="600,175 650,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="920,175 970,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="785,240 785,300" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="920,360 970,360" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="110" width="250" height="130" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="142" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">alert 100100</text><text x="48" y="170" font-size="16"  fill="#33475B" text-anchor="start">brute force จาก</text><text x="48" y="195" font-size="16"  fill="#33475B" text-anchor="start">192.168.10.42</text><rect x="330" y="110" width="270" height="130" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="348" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">manager</text><text x="348" y="170" font-size="16"  fill="#33475B" text-anchor="start">&lt;active-response&gt;</text><text x="348" y="195" font-size="16"  fill="#33475B" text-anchor="start">rules_id 100100</text><text x="348" y="220" font-size="16"  fill="#33475B" text-anchor="start">timeout 600</text><rect x="650" y="110" width="270" height="130" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="668" y="142" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">wazuh-execd (agent)</text><text x="668" y="170" font-size="16"  fill="#33475B" text-anchor="start">firewall-drop add</text><text x="668" y="195" font-size="16"  fill="#33475B" text-anchor="star