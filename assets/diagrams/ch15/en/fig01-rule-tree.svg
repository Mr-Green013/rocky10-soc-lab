<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>The SSH rule tree, from the system rules to the lab rules</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="520" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">The SSH rule tree, from the system rules to the lab rules</text><polyline points="250,230 310,130" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="250,255 310,255" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="250,280 310,380" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="570,130 650,130" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="610" y="120" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">counts</text><polyline points="570,255 650,255" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="610" y="245" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">counts</text><polyline points="980,255 1215,255 1215,265" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="570,380 1060,380" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="200" width="220" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="140" y="247.65" font-size="19" font-weight="700" fill="#33475B" text-anchor="middle">5700 sshd</text><text x="140" y="275.65" font-size="16" fill="#33475B" text-anchor="middle">parent rule for SSH</text><rect x="310" y="80" width="260" height="100" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="328" y="112" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">5710 invalid user</text><text x="328" y="140" font-size="16" fill="#33475B" text-anchor="start">level 5</text><rect x="310" y="205" width="260" height="100" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="328" y="237" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">5716 auth failed</text><text x="328" y="265" font-size="16" fill="#33475B" text-anchor="start">level 5</text><rect x="310" y="330" width="260" height="100" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="328" y="362" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">5715 auth success</text><text x="328" y="390" font-size="16" fill="#33475B" text-anchor="start">level 3</text><rect x="650" y="80" width="330" height="100" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="668" y="112" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">100101 user enumeration</text><text x="668" y="140" font-size="16" fill="#33475B" text-anchor="start">4 times / 120 seconds / one IP</text><rect x="650" y="205" width="330" height="100" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="668" y="237" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">100100 brute force</text><text x="668" y="265" font-size="16" fill="#33475B" text-anchor="start">5 times / 120 seconds / one IP</text><rect x="1060" y="265" width="310" height="130" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1078" y="297" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">100102 success after guessing</text><text x="1078" y="325" font-size="16" fill="#FFFFFF" text-anchor="start">5715 + 100100 already fired</text><text x="1078" y="350" font-size="16" fill="#FFFFFF" text-anchor="start">from the same IP within 300 seconds</text><text x="1078" y="375" font-size="16" fill="#FFFFFF" text-anchor="start">level 13</text></svg>
