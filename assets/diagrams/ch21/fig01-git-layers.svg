<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>git push หนึ่งครั้งผ่าน 4 ชั้นบน node-01 และ server</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1E7D3A"/></marker><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker></defs>
<rect width="1400" height="510" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">git push หนึ่งครั้งผ่าน 4 ชั้นบน node-01 และ server</text><polyline points="220,250 270,150" fill="none" stroke="#1F3A5F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-navy)"/><polyline points="220,290 270,400" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="620,400 670,310" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="990,250 1040,155" fill="none" stroke="#1E7D3A" stroke-width="3"  marker-end="url(#m-green)"/><polyline points="990,310 1040,400" fill="none" stroke="#C0392B" stroke-width="3"  marker-end="url(#m-red)"/><rect x="30" y="210" width="190" height="120" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="125" y="262.65" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">นักพัฒนา</text><text x="125" y="290.65" font-size="16"  fill="#FFFFFF" text-anchor="middle">git push</text><rect x="270" y="80" width="350" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="288" y="112" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">1. Track (auditd)</text><text x="288" y="140" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">-w /usr/bin/git -p x -k git_cmd</text><text x="288" y="165" font-size="16"  fill="#33475B" text-anchor="start">ทุกคำสั่ง + auid</text><text x="288" y="190" font-size="16"  fill="#33475B" text-anchor="start">Wazuh 100370–100372</text><rect x="270" y="330" width="350" height="140" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="288" y="362" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">2. Guard (pre-push hook)</text><text x="288" y="390" font-size="16"  fill="#33475B" text-anchor="start">remote ต้องเป็น git.lab.internal</text><text x="288" y="415" font-size="16"  fill="#33475B" text-anchor="start">ห้าม force push/ลบ main</text><text x="288" y="440" font-size="16"  fill="#33475B" text-anchor="start">เลี่ยงได้ด้วย --no-verify</text><rect x="670" y="210" width="320" height="140" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="688" y="242" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">3. Kernel (Tetragon)</text><text x="688" y="270" font-size="16"  fill="#FFFFFF" text-anchor="start">policy git-egress</text><text x="688" y="295" font-size="16"  fill="#FFFFFF" text-anchor="start">git ต่อ host นอกรายการ → Sigkill</text><text x="688" y="320" font-size="16"  fill="#FFFFFF" text-anchor="start">Wazuh 100378</text><rect x="1040" y="80" width="330" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1058" y="112" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">4. Server (git.lab.internal)</text><text x="1058" y="140" font-size="16"  fill="#33475B" text-anchor="start">receive.denyNonFastForwards</text><text x="1058" y="165" font-size="16"  fill="#33475B" text-anchor="start">receive.denyDeletes</text><text x="1058" y="190" font-size="16"  fill="#33475B" text-anchor="start">ไม่ขึ้นกับฝั่ง client</text><rect x="1040" y="330" width="330" height="140" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="1058" y="362" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">remote ที่ไม่อนุมัติ</text><text x="1058" y="390" font-size="16"  fill="#33475B" text-anchor="start">lab-linux-02 (rogue.git)</text><text x="1058" y="415" font-size="16"  fill="#33475B" text-anchor="start">process ของ git ถูกฆ่า</text><text x="1058" y="440" font-size="16"  fill="#33475B" text-anchor="start">ข้อมูลไปไม่ถึง</text></svg>
