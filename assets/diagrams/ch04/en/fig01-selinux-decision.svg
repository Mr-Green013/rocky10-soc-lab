<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
  <title>Figure 4-1 How SELinux decides when sshd asks to bind port 2222</title>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1F3A5F"/></marker>
  <marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C0392B"/></marker></defs>
  <rect width="1400" height="640" fill="#fff"/>
  <g font-size="17" fill="#33475B">
    <rect x="40" y="60" width="270" height="140" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/>
    <text x="60" y="96" font-size="20" font-weight="700" fill="#1F3A5F">process: sshd</text>
    <text x="60" y="128" font-family="monospace" font-size="15">scontext ...:sshd_t:s0</text>
    <text x="60" y="158">runs as root</text>
    <text x="60" y="184">asks to bind TCP 2222</text>
    <rect x="370" y="60" width="290" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/>
    <text x="390" y="96" font-size="20" font-weight="700" fill="#1F3A5F">Layer 1: DAC</text>
    <text x="390" y="128">normal Unix permissions</text>
    <text x="390" y="156">root may bind ports</text>
    <text x="390" y="184" font-weight="700" fill="#1E7D3A">pass</text>
    <rect x="720" y="60" width="330" height="140" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/>
    <text x="740" y="96" font-size="20" font-weight="700" fill="#1F3A5F">Layer 2: SELinux (MAC)</text>
    <text x="740" y="128" font-family="monospace" font-size="15">port 2222 = unreserved_port_t</text>
    <text x="740" y="156">policy lets sshd_t bind only</text>
    <text x="740" y="182" font-family="monospace" font-size="15">ssh_port_t (22)</text>
    <rect x="1110" y="60" width="250" height="140" rx="12" fill="#C0392B"/>
    <text x="1130" y="100" font-size="22" font-weight="700" fill="#fff">DENIED</text>
    <text x="1130" y="134" fill="#fff">sshd listens on :22 only</text>
    <text x="1130" y="162" fill="#fff">even though it runs as root</text>
  </g>
  <g stroke="#1F3A5F" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="312" y1="130" x2="366" y2="130"/><line x1="662" y1="130" x2="716" y2="130"/>
  </g>
  <line x1="1052" y1="130" x2="1106" y2="130" stroke="#C0392B" stroke-width="3" marker-end="url(#r)"/>
  <line x1="1235" y1="202" x2="1235" y2="276" stroke="#C0392B" stroke-width="3" marker-end="url(#r)"/>
  <g font-size="17" fill="#33475B">
    <rect x="860" y="280" width="500" height="120" rx="12" fill="#fff" stroke="#C0392B" stroke-width="2"/>
    <text x="880" y="314" font-size="19" font-weight="700" fill="#1F3A5F">AVC logged to /var/log/audit/audit.log</text>
    <text x="880" y="344" font-family="monospace" font-size="14">avc: denied { name_bind } src=2222 comm="sshd"</text>
    <text x="880" y="370" font-family="monospace" font-size="14">scontext=…sshd_t… tcontext=…unreserved_port_t…</text>
    <rect x="40" y="280" width="760" height="120" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/>
    <text x="60" y="314" font-size="19" font-weight="700" fill="#1F3A5F">the admin reads the cause</text>
    <text x="60" y="344" font-family="monospace" font-size="15">sudo ausearch -m AVC -ts recent</text>
    <text x="60" y="372" font-family="monospace" font-size="15">sudo sealert -a /var/log/audit/audit.log</text>
  </g>
  <line x1="858" y1="340" x2="804" y2="340" stroke="#1F3A5F" stroke-width="3" marker-end="url(#a)"/>
  <rect x="40" y="440" width="1320" height="160" rx="12" fill="#1F3A5F"/>
  <text x="60" y="478" font-size="20" font-weight="700" fill="#fff">fix it by telling the policy, not by disabling SELinux</text>
  <text x="60" y="514" font-family="monospace" font-size="17" fill="#F2CC60">sudo semanage port -a -t ssh_port_t -p tcp 2222</text>
  <text x="60" y="548" font-size="17" fill="#DCE6F2">wrong port → semanage port · wrong file label → restorecon · non-standard path → semanage fcontext · feature off → setsebool -P</text>
  <text x="60" y="578" font-size="16" fill="#DCE6F2">Never set SELINUX=disabled: it removes the layer that limits a hijacked process, leaving it full root power</text>
</svg>
