<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>The path from a syscall to a Tetragon alert</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="540" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">The path from a syscall to a Tetragon alert</text><polyline points="260,165 310,165" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="590,165 640,165" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="940,165 990,165" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1180,240 1180,330" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="990,405 940,405" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="560,405 510,405" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="90" width="230" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="122" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">process</text><text x="48" y="150" font-size="16" fill="#33475B" text-anchor="start">in a container or on the host</text><text x="48" y="175" font-size="16" fill="#33475B" text-anchor="start">exec / open / connect</text><rect x="310" y="90" width="280" height="150" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="328" y="122" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">kernel hook</text><text x="328" y="150" font-size="16" fill="#FFFFFF" text-anchor="start">security_bprm_check</text><text x="328" y="175" font-size="16" fill="#FFFFFF" text-anchor="start">security_file_permission</text><text x="328" y="200" font-size="16" fill="#FFFFFF" text-anchor="start">tcp_connect, sys_chmod</text><rect x="640" y="90" width="300" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="658" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">selector (eBPF)</text><text x="658" y="150" font-size="16" fill="#33475B" text-anchor="start">matchArgs: path, mode, IP</text><text x="658" y="175" font-size="16" fill="#33475B" text-anchor="start">matchBinaries: who called</text><text x="658" y="200" font-size="16" fill="#33475B" text-anchor="start">matchNamespaces: host_ns</text><rect x="990" y="90" width="380" height="150" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1008" y="122" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">action</text><text x="1008" y="150" font-size="16" fill="#FFFFFF" text-anchor="start">Post: record only</text><text x="1008" y="175" font-size="16" fill="#FFFFFF" text-anchor="start">Sigkill: kill the process at once</text><text x="1008" y="200" font-size="16" fill="#FFFFFF" text-anchor="start">Override: return an error instead</text><rect x="990" y="330" width="380" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="1008" y="362" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">tetragon daemon</text><text x="1008" y="390" font-size="16" fill="#33475B" text-anchor="start">export-allowlist: PROCESS_KPROBE</text><text x="1008" y="415" font-size="16" fill="#33475B" text-anchor="start">/var/log/tetragon/tetragon.log</text><rect x="560" y="330" width="380" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="578" y="362" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">Wazuh agent → manager</text><text x="578" y="390" font-size="16" fill="#33475B" text-anchor="start">localfile json + label integration</text><text x="578" y="415" font-size="16" fill="#33475B" text-anchor="start">rule 100800–100830</text><rect x="30" y="330" width="480" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="48" y="362" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">Graylog</text><text x="48" y="390" font-size="16" fill="#33475B" text-anchor="start">field wazuh_tg_policy, wazuh_tg_action</text><text x="48" y="415" font-size="16" fill="#33475B" text-anchor="start">dashboard per policy</text></svg>
