<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>The order for putting a policy into production</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="420" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">The order for putting a policy into production</text><polyline points="330,185 370,185" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="680,185 720,185" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1030,185 1070,185" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="100" width="300" height="170" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="132" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">1. dynamic test</text><text x="48" y="160" font-size="16" fill="#33475B" text-anchor="start">tetra tracingpolicy add</text><text x="48" y="185" font-size="16" fill="#33475B" text-anchor="start">trigger with normal commands</text><text x="48" y="210" font-size="16" fill="#33475B" text-anchor="start">look at the events in tetragon.log</text><rect x="370" y="100" width="310" height="170" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="388" y="132" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">2. observe (Post)</text><text x="388" y="160" font-size="16" fill="#33475B" text-anchor="start">rateLimit 1m</text><text x="388" y="185" font-size="16" fill="#33475B" text-anchor="start">count binaries with jq</text><text x="388" y="210" font-size="16" fill="#33475B" text-anchor="start">lab 10 minutes · production ≥ 24 h</text><rect x="720" y="100" width="310" height="170" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="738" y="132" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">3. enforce (Sigkill)</text><text x="738" y="160" font-size="16" fill="#33475B" text-anchor="start">add names to NotIn</text><text x="738" y="185" font-size="16" fill="#33475B" text-anchor="start">keep a backup SSH session open</text><text x="738" y="210" font-size="16" fill="#33475B" text-anchor="start">test a new SSH login at once</text><rect x="1070" y="100" width="300" height="170" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1088" y="132" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">4. install permanently</text><text x="1088" y="160" font-size="16" fill="#33475B" text-anchor="start">install -m 600</text><text x="1088" y="185" font-size="16" fill="#33475B" text-anchor="start">tetragon.tp.d/</text><text x="1088" y="210" font-size="16" fill="#33475B" text-anchor="start">restart, then list shows all 9</text><text x="700" y="340" font-size="17" fill="#C0392B" text-anchor="middle">Emergency removal: sudo tetra tracingpolicy delete &lt;name&gt; from the backup session or the Proxmox console</text></svg>
