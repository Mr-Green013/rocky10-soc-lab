<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Override กับ Sigkill ต่างกันที่ operation เกิดขึ้นหรือไม่</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Override กับ Sigkill ต่างกันที่ operation เกิดขึ้นหรือไม่</text><polyline points="270,200 330,145" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="270,270 330,335" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="810,145 870,145" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="810,335 870,335" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="160" width="240" height="150" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="192" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">kernel hook</text><text x="48" y="220" font-size="16"  fill="#FFFFFF" text-anchor="start">selector ตรง</text><text x="48" y="245" font-size="16"  fill="#FFFFFF" text-anchor="start">ก่อน operation จบ</text><rect x="330" y="70" width="480" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="348" y="102" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">Override (+ Sigkill)</text><text x="348" y="130" font-size="16"  fill="#33475B" text-anchor="start">คืน error ก่อน operation ทำงาน</text><text x="348" y="155" font-size="16"  fill="#33475B" text-anchor="start">chmod หรือการอ่านไฟล์ไม่เกิดเลย</text><text x="348" y="180" font-size="16"  fill="#33475B" text-anchor="start">ต้องมี CONFIG_BPF_KPROBE_OVERRIDE</text><rect x="330" y="260" width="480" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="348" y="292" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">Sigkill อย่างเดียว</text><text x="348" y="320" font-size="16"  fill="#33475B" text-anchor="start">ส่ง SIGKILL แล้วให้ hook ทำงานต่อจนจบ</text><text x="348" y="345" font-size="16"  fill="#33475B" text-anchor="start">operation อาจสำเร็จก่อน process ตาย</text><text x="348" y="370" font-size="16"  fill="#33475B" text-anchor="start">exec: ปลอดภัย · chmod: ต้องตรวจซ้ำ</text><rect x="870" y="70" width="500" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="888" y="102" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">ผลที่ได้</text><text x="888" y="130" font-size="16"  fill="#33475B" text-anchor="start">exit 137 และไม่มีผลค้าง</text><text x="888" y="155" font-size="16"  fill="#33475B" text-anchor="start">alert 100802 หรือ rule ราย policy</text><rect x="870" y="260" width="500" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="888" y="292" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">ชั้นสำรองที่ต้องมี</text><text x="888" y="320" font-size="16"  fill="#33475B" text-anchor="start">no-new-privileges ทำให้ SUID ไร้ผล</text><text x="888" y="345" font-size="16"  fill="#33475B" text-anchor="start">network แบบ internal กั้น egress</text><text x="888" y="370" font-size="16"  fill="#33475B" text-anchor="start">ตรวจผลค้างหลังทุก alert</text></svg>
