<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>One SSH log line travels through the stream and the SOC-SSH pipeline</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker></defs>
<rect width="1400" height="520" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">One SSH log line travels through the stream and the SOC-SSH pipeline</text><polyline points="210,255 250,255" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="470,255 495,255 495,130 520,130" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="470,255 520,255" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="470,255 495,255 495,375 520,375" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="760,130 810,130" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1140,145 1180,145" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#m-red)"/><polyline points="975,310 975,375 1180,375" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="200" width="180" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="120" y="247.65" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="middle">Input</text><text x="120" y="275.65" font-size="16" fill="#33475B" text-anchor="middle">syslog-tcp-1514</text><rect x="250" y="200" width="220" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="268" y="232" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Filter Chain</text><text x="268" y="260" font-size="16" fill="#33475B" text-anchor="start">stream rules</text><text x="268" y="285" font-size="16" fill="#33475B" text-anchor="start">(no ssh_event yet)</text><rect x="520" y="80" width="240" height="100" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="538" y="112" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">auth-logs</text><text x="538" y="140" font-size="16" fill="#33475B" text-anchor="start">application_name ^sshd</text><rect x="520" y="210" width="240" height="90" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="538" y="242" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">sudo-activity</text><text x="538" y="270" font-size="16" fill="#33475B" text-anchor="start">application_name = sudo</text><rect x="520" y="330" width="240" height="90" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="538" y="362" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">Default Stream</text><text x="538" y="390" font-size="16" fill="#33475B" text-anchor="start">every message</text><rect x="810" y="80" width="330" height="230" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="828" y="112" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">Pipeline SOC-SSH</text><text x="828" y="140" font-size="16" fill="#33475B" text-anchor="start">Stage 0 classify (Rule 1–4)</text><text x="828" y="165" font-size="16" fill="#33475B" text-anchor="start">Stage 1 extract fields (Rule 5–7)</text><text x="828" y="190" font-size="16" fill="#33475B" text-anchor="start">Stage 2 default severity</text><text x="828" y="215" font-size="16" fill="#33475B" text-anchor="start">Stage 3 raise by type</text><text x="828" y="240" font-size="16" fill="#33475B" text-anchor="start">Stage 4 root → critical</text><rect x="1180" y="80" width="190" height="130" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1198" y="112" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">suspicious-ip</text><text x="1198" y="140" font-size="16" fill="#FFFFFF" text-anchor="start">route_to_stream()</text><text x="1198" y="165" font-size="16" fill="#FFFFFF" text-anchor="start">from Rule 10, 11</text><rect x="1180" y="330" width="190" height="90" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1275" y="367.65" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="middle">Index</text><text x="1275" y="395.65" font-size="16" fill="#33475B" text-anchor="middle">searchable</text><text x="700" y="485" font-size="17" fill="#C0392B" text-anchor="middle" font-weight="700">every stage is set to "None or more rules on this stage match", otherwise messages stop at Stage 0</text></svg>
