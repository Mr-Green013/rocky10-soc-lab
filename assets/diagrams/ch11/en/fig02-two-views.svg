<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>One login by aod, seen from two angles</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">One login by aod, seen from two angles</text><polyline points="230,200 300,200" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="230,275 300,275" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="820,200 900,200" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="820,285 900,285" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="180" width="200" height="110" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="130" y="227.65" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">aod</text><text x="130" y="255.65" font-size="16" fill="#FFFFFF" text-anchor="middle">ssh from .100</text><rect x="300" y="90" width="520" height="130" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="318" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">/var/log/secure (sshd-session)</text><text x="318" y="150" font-size="16" fill="#33475B" text-anchor="start">Accepted publickey for aod from 192.168.10.100</text><text x="318" y="175" font-size="16" fill="#33475B" text-anchor="start">pam_unix(sshd:session): session opened for user aod</text><rect x="300" y="260" width="520" height="170" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="318" y="292" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">auditd (kernel through PAM)</text><text x="318" y="320" font-size="16" fill="#33475B" text-anchor="start">USER_AUTH  acct="aod" addr=192.168.10.100 res=success</text><text x="318" y="345" font-size="16" fill="#33475B" text-anchor="start">USER_START auid=1000 ses=7 acct="aod"</text><text x="318" y="370" font-size="16" fill="#33475B" text-anchor="start">every command from here on has auid=1000</text><text x="318" y="395" font-size="16" fill="#33475B" text-anchor="start">even after sudo -i</text><rect x="900" y="180" width="470" height="130" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="918" y="212" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">Graylog stream auth-logs</text><text x="918" y="240" font-size="16" fill="#33475B" text-anchor="start">both angles in one place</text><text x="918" y="265" font-size="16" fill="#33475B" text-anchor="start">the pipeline builds ssh_event, src_ip, audit_auid</text></svg>
