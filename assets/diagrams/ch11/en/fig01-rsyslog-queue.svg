<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>rsyslog: when Graylog is down, logs wait in the disk queue and all arrive later</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker></defs>
<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">rsyslog: when Graylog is down, logs wait in the disk queue and all arrive later</text><rect x="30" y="80" width="760" height="340" rx="14" fill="none" stroke="#5B6770" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="108" font-size="17" font-weight="700" fill="#33475B">lab-linux-01 / lab-linux-02</text><polyline points="265,190 300,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="520,190 555,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="765,190 860,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="812.5" y="180" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">TCP 1514</text><polyline points="1080,190 1130,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="532.5,280 532.5,267.5 410,267.5 410,255" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-red)"/><rect x="55" y="125" width="210" height="130" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="73" y="157" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">log source</text><text x="73" y="185" font-size="16" fill="#33475B" text-anchor="start">sshd-session, sudo</text><text x="73" y="210" font-size="16" fill="#33475B" text-anchor="start">audisp-syslog</text><rect x="300" y="125" width="220" height="130" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="318" y="157" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">rsyslog</text><text x="318" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">90-graylog.conf</text><text x="318" y="210" font-size="16" fill="#33475B" text-anchor="start">omfwd · TCP</text><rect x="555" y="125" width="210" height="130" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="573" y="157" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">disk queue</text><text x="573" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">/var/lib/rsyslog</text><text x="573" y="210" font-size="16" fill="#33475B" text-anchor="start">up to 1 GB</text><rect x="300" y="280" width="465" height="125" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="318" y="312" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">SELinux</text><text x="318" y="340" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">semanage port -a -t syslogd_port_t</text><text x="318" y="365" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">    -p tcp 1514</text><rect x="860" y="125" width="220" height="130" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="878" y="157" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">DOCKER-USER</text><text x="878" y="185" font-size="16" fill="#33475B" text-anchor="start">accepts only</text><text x="878" y="210" font-size="16" fill="#33475B" text-anchor="start">192.168.10.0/24</text><rect x="1130" y="125" width="240" height="130" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="1148" y="157" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">Graylog Input</text><text x="1148" y="185" font-size="16" fill="#33475B" text-anchor="start">syslog-tcp-1514</text><text x="1148" y="210" font-size="16" fill="#33475B" text-anchor="start">RUNNING</text><text x="1080" y="330" font-size="17" fill="#C0392B" text-anchor="middle">Graylog down → messages pile up in the queue</text><text x="1080" y="362" font-size="17" fill="#1E7B3A" text-anchor="middle">back up → sent on in order, nothing lost</text></svg>
