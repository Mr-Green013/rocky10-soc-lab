<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>limit ของ Lab 13 ตามจังหวะของ connection และ log ที่เกิด</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker></defs>
<rect width="1400" height="560" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">limit ของ Lab 13 ตามจังหวะของ connection และ log ที่เกิด</text><polyline points="290,175 330,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="690,175 725,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1015,175 1050,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="160,260 160,320" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-red)"/><polyline points="510,260 510,320" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-red)"/><polyline points="870,260 870,320" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-red)"/><polyline points="1210,260 1210,320" fill="none" stroke="#1F3A5F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-navy)"/><rect x="30" y="90" width="260" height="170" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">1. TCP connect</text><text x="48" y="150" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">MaxStartups 10:30:60</text><text x="48" y="175" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">PerSourcePenalties</text><text x="48" y="200" font-size="16"  fill="#33475B" text-anchor="start">ทิ้ง connection ก่อน</text><text x="48" y="225" font-size="16"  fill="#33475B" text-anchor="start">คุยกันจริง</text><rect x="330" y="90" width="360" height="170" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="348" y="122" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">2. ก่อนยืนยันตัวตน</text><text x="348" y="150" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">LoginGraceTime 30</text><text x="348" y="175" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">MaxAuthTries 3</text><text x="348" y="200" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">AllowGroups wheel admins sysadmins</text><rect x="725" y="90" width="290" height="170" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="743" y="122" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">3. เปิด session (PAM)</text><text x="743" y="150" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">maxlogins 3</text><text x="743" y="175" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">@sysadmins maxlogins 2</text><rect x="1050" y="90" width="320" height="170" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1068" y="122" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">4. ระหว่างใช้งาน</text><text x="1068" y="150" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">MaxSessions 4</text><text x="1068" y="175" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ChannelTimeout session:*=15m</text><text x="1068" y="200" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">TMOUT=900</text><rect x="30" y="320" width="260" height="110" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="48" y="352" font-size="19" font-weight="700" fill="#C0392B" text-anchor="start">log</text><text x="48" y="380" font-size="16"  fill="#33475B" text-anchor="start">drop connection #N</text><text x="48" y="405" font-size="16"  fill="#33475B" text-anchor="start">... penalty: ...</text><rect x="330" y="320" width="360" height="160" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="348" y="352" font-size="19" font-weight="700" fill="#C0392B" text-anchor="start">log</text><text x="348" y="380" font-size="16"  fill="#33475B" text-anchor="start">maximum authentication attempts exceeded</text><text x="348" y="405" font-size="16"  fill="#33475B" text-anchor="start">Timeout before authentication</text><text x="348" y="430" font-size="16"  fill="#33475B" text-anchor="start">not allowed because none of user's</text><text x="348" y="455" font-size="16"  fill="#33475B" text-anchor="start">groups are listed in AllowGroups</text><rect x="725" y="320" width="290" height="110" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="743" y="352" font-size="19" font-weight="700" fill="#C0392B" text-anchor="start">log</text><text x="743" y="380" font-size="16"  fill="#33475B" text-anchor="start">Too many logins (max 3)</text><text x="743" y="405" font-size="16"  fill="#33475B" text-anchor="start">for aod</text><rect x="1050" y="320" width="320" height="160" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="1068" y="352" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">client หลุดเงียบ</text><text x="1068" y="380" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ClientAliveInterval 300</text><text x="1068" y="405" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ClientAliveCountMax 2</text><text x="1068" y="430" font-size="16"  fill="#33475B" text-anchor="start">= ตัดภายใน 10 นาที</text><text x="700" y="530" font-size="17" fill="#33475B" text-anchor="middle">ClientAlive ตัดเฉพาะ client ที่ไม่ตอบ ผู้ใช้ที่นั่งเฉยถูกตัดโดย ChannelTimeout หรือ TMOUT เท่านั้น</text></svg>
