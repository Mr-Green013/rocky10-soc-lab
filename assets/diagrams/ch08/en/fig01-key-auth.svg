<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>SSH key login: the secret never leaves the client</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-teal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2A9D8F"/></marker><marker id="m-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1E7D3A"/></marker></defs>
<rect width="1400" height="560" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">SSH key login: the secret never leaves the client</text><rect x="30" y="80" width="390" height="400" rx="14" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="108" font-size="17" font-weight="700" fill="#1F3A5F">Windows (client)</text><rect x="980" y="80" width="390" height="400" rx="14" fill="none" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="8 6"/><text x="996" y="108" font-size="17" font-weight="700" fill="#1B6F65">lab-linux-01 (server)</text><polyline points="420,160 980,160" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="700" y="148" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">1. offer the public key (fingerprint SHA256:...)</text><polyline points="980,230 420,230" fill="none" stroke="#2A9D8F" stroke-width="3" marker-end="url(#m-teal)"/><text x="700" y="218" font-size="15" text-anchor="middle" fill="#2A9D8F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">2. this key is in authorized_keys; send a signature</text><polyline points="420,340 980,340" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="700" y="328" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">3. a signature of the session ID made with the private key</text><polyline points="980,410 420,410" fill="none" stroke="#1E7D3A" stroke-width="3" marker-end="url(#m-green)"/><text x="700" y="398" font-size="15" text-anchor="middle" fill="#1E7D3A" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">4. signature is valid: login succeeds</text><rect x="55" y="125" width="340" height="130" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="73" y="157" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">private key</text><text x="73" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">id_ed25519_lab</text><text x="73" y="210" font-size="16" fill="#33475B" text-anchor="start">encrypted with a passphrase</text><text x="73" y="235" font-size="16" fill="#33475B" text-anchor="start">never leaves this machine</text><rect x="55" y="300" width="340" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="73" y="332" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">ssh-agent</text><text x="73" y="360" font-size="16" fill="#33475B" text-anchor="start">holds the key with the passphrase removed</text><text x="73" y="385" font-size="16" fill="#33475B" text-anchor="start">in memory</text><text x="73" y="410" font-size="16" fill="#33475B" text-anchor="start">enter the passphrase once per login</text><rect x="1005" y="125" width="340" height="130" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="1023" y="157" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">authorized_keys</text><text x="1023" y="185" font-size="16" fill="#33475B" text-anchor="start">aod's public key</text><text x="1023" y="210" font-size="16" fill="#33475B" text-anchor="start">mode 600 · ssh_home_t</text><text x="1023" y="235" font-size="16" fill="#33475B" text-anchor="start">or from IPA (chapter 7)</text><rect x="1005" y="300" width="340" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="1023" y="332" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">sshd</text><text x="1023" y="360" font-size="16" fill="#33475B" text-anchor="start">checks the signature with the public key</text><text x="1023" y="385" font-size="16" fill="#33475B" text-anchor="start">log entry:</text><text x="1023" y="410" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">Accepted publickey ...</text><text x="700" y="525" font-size="18" fill="#1F3A5F" text-anchor="middle" font-weight="700">Only the public key and a one-time signature cross the network; never the private key or the passphrase</text></svg>
