<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ไฟล์ใน sshd_config.d หลังจบบทที่ 8 และค่าที่มีผลจริง</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="600" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ไฟล์ใน sshd_config.d หลังจบบทที่ 8 และค่าที่มีผลจริง</text><rect x="30" y="80" width="780" height="490" rx="14" fill="none" stroke="#5B6770" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="108" font-size="17" font-weight="700" fill="#33475B">sshd_config.d/ อ่านเรียงตามชื่อ ค่าแรกที่พบชนะ</text><polyline points="810,245 880,245" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1125,125 1125,550" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="55" y="125" width="730" height="95" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="73" y="157" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">01-soclab-auth.conf (บทที่ 8)</text><text x="73" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">PasswordAuthentication no · KbdInteractiveAuthentication no</text><rect x="55" y="235" width="730" height="95" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="73" y="267" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">04-ipa.conf (บทที่ 7)</text><text x="73" y="295" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ChallengeResponseAuthentication yes   # มาทีหลัง จึงถูกเมิน</text><rect x="55" y="345" width="730" height="95" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="73" y="377" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">20-session-limit.conf (บทที่ 8)</text><text x="73" y="405" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">MaxAuthTries 3 · LoginGraceTime 30 · AllowGroups ...</text><rect x="55" y="455" width="730" height="95" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="73" y="487" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">50-cloud-init.conf · 50-redhat.conf</text><text x="73" y="515" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">PasswordAuthentication no   # ซ้ำกับ 01- ไม่มีผล</text><rect x="880" y="125" width="490" height="245" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="898" y="157" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">sudo sshd -T</text><text x="898" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">pubkeyauthentication yes</text><text x="898" y="210" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">passwordauthentication no</text><text x="898" y="235" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">kbdinteractiveauthentication no</text><text x="898" y="260" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">gssapiauthentication yes</text><text x="898" y="285" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">permitrootlogin no</text><text x="898" y="310" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#FFFFFF" text-anchor="start">maxauthtries 3</text><rect x="880" y="420" width="490" height="130" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="898" y="452" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">วิธีที่ยัง login ได้</text><text x="898" y="480" font-size="16"  fill="#33475B" text-anchor="start">publickey (authorized_keys หรือ IPA)</text><text x="898" y="505" font-size="16"  fill="#33475B" text-anchor="start">gssapi-with-mic (Kerberos ticket)</text><text x="898" y="530" font-size="16"  fill="#33475B" text-anchor="start">ไม่มีวิธีใดรับรหัสผ่านผ่าน SSH</text></svg>
