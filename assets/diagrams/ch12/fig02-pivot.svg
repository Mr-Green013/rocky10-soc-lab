<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>เส้นทาง pivot จาก login หนึ่งครั้ง</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="480" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">เส้นทาง pivot จาก login หนึ่งครั้ง</text><polyline points="310,175 380,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="310,255 380,255" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="310,240 345,240 345,390 380,390" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="860,175 930,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="860,255 930,255" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="860,390 895,390 895,240 930,240" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="170" width="280" height="140" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="202" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">event เริ่มต้น</text><text x="48" y="230" font-size="16"  fill="#FFFFFF" text-anchor="start">ssh_event:auth_success</text><text x="48" y="255" font-size="16"  fill="#FFFFFF" text-anchor="start">ssh_user=aod</text><text x="48" y="280" font-size="16"  fill="#FFFFFF" text-anchor="start">src_ip=192.168.10.100</text><rect x="380" y="70" width="480" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="398" y="102" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">pivot ด้วย src_ip</text><text x="398" y="130" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">src_ip:192.168.10.100</text><text x="398" y="155" font-size="16"  fill="#33475B" text-anchor="start">IP นี้เข้าเครื่องไหนอีก</text><rect x="380" y="200" width="480" height="110" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="398" y="232" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">pivot ด้วย ssh_user</text><text x="398" y="260" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ssh_user:aod AND ssh_event:auth_*</text><text x="398" y="285" font-size="16"  fill="#33475B" text-anchor="start">บัญชีนี้ล้มเหลวที่ไหนก่อนหน้า</text><rect x="380" y="330" width="480" height="120" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="398" y="362" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">pivot ด้วย session</text><text x="398" y="390" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ssh_event:session_start → audit_session=7</text><text x="398" y="415" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">source:lab\-linux\-01* AND message:"ses=7"</text><rect x="930" y="170" width="440" height="140" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="948" y="202" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">ภาพทั้งเหตุการณ์</text><text x="948" y="230" font-size="16"  fill="#33475B" text-anchor="start">ใคร · จากไหน · เครื่องใด</text><text x="948" y="255" font-size="16"  fill="#33475B" text-anchor="start">เมื่อไร · ทำอะไรหลังเข้า</text><text x="948" y="280" font-size="16"  fill="#33475B" text-anchor="start">ยืนยันบนเครื่องด้วย ausearch --session</text></svg>
