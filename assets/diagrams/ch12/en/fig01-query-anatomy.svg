<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Reading a one-line query</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="520" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Reading a one-line query</text><polyline points="330,150 370,150" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="670,150 710,150" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="90" width="300" height="120" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="122" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">1. time range</text><text x="48" y="150" font-size="16" fill="#33475B" text-anchor="start">top left corner</text><text x="48" y="175" font-size="16" fill="#33475B" text-anchor="start">default 5 minutes</text><rect x="370" y="90" width="300" height="120" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="388" y="122" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">2. Stream</text><text x="388" y="150" font-size="16" fill="#33475B" text-anchor="start">auth-logs, sudo-activity</text><text x="388" y="175" font-size="16" fill="#33475B" text-anchor="start">limits scope and permissions</text><rect x="710" y="90" width="660" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="728" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">3. Query</text><text x="728" y="150" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">(ssh_event:auth_failed OR ssh_event:invalid_user)</text><text x="728" y="175" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">  AND NOT src_ip:192.168.10.*</text><rect x="30" y="280" width="320" height="180" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="48" y="312" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">field:value</text><text x="48" y="340" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ssh_user:aod</text><text x="48" y="365" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">message:"Failed password"</text><text x="48" y="390" font-size="16" fill="#33475B" text-anchor="start">phrases use quotes</text><rect x="380" y="280" width="310" height="180" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="398" y="312" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">operators</text><text x="398" y="340" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">AND  OR  NOT  ( )</text><text x="398" y="365" font-size="16" fill="#33475B" text-anchor="start">must be uppercase</text><text x="398" y="390" font-size="16" fill="#33475B" text-anchor="start">lowercase and = a search term</text><rect x="720" y="280" width="310" height="180" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="738" y="312" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">ranges and existence</text><text x="738" y="340" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">severity_level:&gt;=3</text><text x="738" y="365" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">severity_level:[3 TO 4]</text><text x="738" y="390" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">_exists_:src_ip</text><rect x="1060" y="280" width="310" height="180" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="1078" y="312" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">escape</text><text x="1078" y="340" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">audisp\-syslog</text><text x="1078" y="365" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">lab\-linux\-01*</text><text x="1078" y="390" font-size="16" fill="#33475B" text-anchor="start">the characters - : / need \</text></svg>
