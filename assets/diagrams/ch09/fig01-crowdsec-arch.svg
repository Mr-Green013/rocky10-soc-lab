<rect width="1400" height="560" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">เส้นทางของ log ใน CrowdSec บน lab-linux-01</text><rect x="250" y="80" width="840" height="220" rx="14" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="8 6"/><text x="266" y="108" font-size="17" font-weight="700" fill="#1F3A5F">Security Engine (crowdsec)</text><polyline points="220,200 275,200" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="475,200 505,200" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="795,200 825,200" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1065,200 1130,200" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="1097.5" y="190" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">alert</text><polyline points="1250,275 1250,360" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="1250" y="307.5" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">decision</text><polyline points="1130,435 1065,435" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="825,435 750,435" fill="none" stroke="#C0392B" stroke-width="3"  marker-end="url(#m-red)"/><text x="787.5" y="425" font-size="15" text-anchor="middle" fill="#C0392B" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">drop</text><rect x="30" y="125" width="190" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="48" y="157" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">log</text><text x="48" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">/var/log/secure</text><text x="48" y="210" font-size="16"  fill="#33475B" text-anchor="start">sshd-session</text><text x="48" y="235" font-size="16"  fill="#33475B" text-anchor="start">Failed password</text><rect x="275" y="125" width="200" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="293" y="157" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">acquisition</text><text x="293" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">acquis.yaml</text><text x="293" y="210" font-size="16"  fill="#33475B" text-anchor="start">อ่านไฟล์หรือ</text><text x="293" y="235" font-size="16"  fill="#33475B" text-anchor="start">journal</text><rect x="505" y="125" width="290" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="523" y="157" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">parsers</text><text x="523" y="185" font-size="16"  fill="#33475B" text-anchor="start">s00-raw → s01-parse</text><text x="523" y="210" font-size="16"  fill="#33475B" text-anchor="start">s02-enrich: whitelist,</text><text x="523" y="235" font-size="16"  fill="#33475B" text-anchor="start">geoip, วันเวลา</text><rect x="825" y="125" width="240" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="843" y="157" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">scenarios</text><text x="843" y="185" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">crowdsecurity/ssh-bf</text><text x="843" y="210" font-size="16"  fill="#33475B" text-anchor="start">leaky bucket</text><text x="843" y="235" font-size="16"  fill="#33475B" text-anchor="start">นับแยกตาม IP</text><rect x="1130" y="125" width="240" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="1148" y="157" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">Local API</text><text x="1148" y="185" font-size="16"  fill="#33475B" text-anchor="start">alert + decision</text><text x="1148" y="210" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">profiles.yaml</text><text x="1148" y="235" font-size="16"  fill="#33475B" text-anchor="start">ban 4h · :8080</text><rect x="1130" y="360" width="240" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1148" y="392" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">bouncer</text><text x="1148" y="420" font-size="16"  fill="#33475B" text-anchor="start">nftables</text><text x="1148" y="445" font-size="16"  fill="#33475B" text-anchor="start">ดึง decision</text><text x="1148" y="470" font-size="16"  fill="#33475B" text-anchor="start">ทุก 10 วินาที</text><rect x="825" y="360" width="240" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="843" y="392" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">nftables set</text><text x="843" y="420" font-size="16"  fill="#33475B" text-anchor="start">IP ที่ถูก ban</text><text x="843" y="445" font-size="16"  fill="#33475B" text-anchor="start">drop ทุก packet</text><text x="843" y="470" font-size="16"  fill="#33475B" text-anchor="start">ทุก port</text><rect x="480" y="360" width="270" height="150" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="498" y="392" font-size="19" font-weight="700" fill="#C0392B" text-anchor="start">lab-linux-02 (ทดสอบ)</text><text x="498" y="420" font-size="16"  fill="#33475B" text-anchor="start">ssh, ping ไม่ตอบ</text><text x="498" y="445" font-size="16"  fill="#33475B" text-anchor="start">จนกว่า decision</text><text x="498" y="470" font-size="16"  fill="#33475B" text-anchor="start">หมดอายุหรือถูกลบ</text><rect x="30" y="360" width="410" height="150" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="392" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start