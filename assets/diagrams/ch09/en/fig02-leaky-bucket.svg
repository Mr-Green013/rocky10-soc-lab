<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ssh-bf: capacity 5 · leaks 1 event every 10 seconds · one bucket per IP</title>
<defs><marker id="m-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#8A96A3"/></marker></defs>
<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ssh-bf: capacity 5 · leaks 1 event every 10 seconds · one bucket per IP</text><polyline points="320,165 1060,165" fill="none" stroke="#8A96A3" stroke-width="3" marker-end="url(#m-gray)"/><polyline points="320,335 1060,335" fill="none" stroke="#8A96A3" stroke-width="3" marker-end="url(#m-gray)"/><rect x="30" y="110" width="290" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="48" y="142" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">a user mistypes</text><text x="48" y="170" font-size="16" fill="#33475B" text-anchor="start">twice in a minute</text><rect x="1060" y="110" width="310" height="110" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1078" y="142" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">bucket does not overflow</text><text x="1078" y="170" font-size="16" fill="#33475B" text-anchor="start">leaks before it fills · no alert</text><rect x="30" y="280" width="290" height="110" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="312" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">a password-guessing script</text><text x="48" y="340" font-size="16" fill="#33475B" text-anchor="start">12 tries in a few seconds</text><rect x="1060" y="280" width="310" height="110" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1078" y="312" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">alert + decision</text><text x="1078" y="340" font-size="16" fill="#FFFFFF" text-anchor="start">IP banned for 4 hours, all ports</text><text x="450" y="176" font-size="30" fill="#5B6770" text-anchor="middle">●</text><text x="800" y="176" font-size="30" fill="#5B6770" text-anchor="middle">●</text><text x="450" y="145" font-size="15" fill="#5B6770" text-anchor="middle">event 1</text><text x="800" y="145" font-size="15" fill="#5B6770" text-anchor="middle">event 2 (bucket ~0)</text><text x="420" y="346" font-size="30" fill="#E76F51" text-anchor="middle">●</text><text x="470" y="346" font-size="30" fill="#E76F51" text-anchor="middle">●</text><text x="520" y="346" font-size="30" fill="#E76F51" text-anchor="middle">●</text><text x="570" y="346" font-size="30" fill="#E76F51" text-anchor="middle">●</text><text x="620" y="346" font-size="30" fill="#E76F51" text-anchor="middle">●</text><text x="670" y="350" font-size="40" fill="#C0392B" text-anchor="middle">●</text><text x="670" y="305" font-size="16" fill="#C0392B" text-anchor="middle" font-weight="700">6th event: overflow</text><text x="520" y="315" font-size="15" fill="#5B6770" text-anchor="middle">full (5)</text><text x="700" y="440" font-size="16" fill="#5B6770" text-anchor="middle">The horizontal axis is time: the wider the gap between events, the more the bucket leaks</text></svg>
