<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ชั้นป้องกันของ SSH บน lab-linux-01 หลังจบบทที่ 9</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="430" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ชั้นป้องกันของ SSH บน lab-linux-01 หลังจบบทที่ 9</text><polyline points="210,225 250,225" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="520,225 560,225" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="820,225 860,225" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1110,225 1150,225" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="110" width="180" height="230" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="120" y="192.65" font-size="19" font-weight="700" fill="#C0392B" text-anchor="middle">ผู้โจมตี</text><text x="120" y="220.65" font-size="16"  fill="#33475B" text-anchor="middle">IP เดี่ยว</text><text x="120" y="245.65" font-size="16"  fill="#33475B" text-anchor="middle">หรือ Tor</text><text x="120" y="270.65" font-size="16"  fill="#33475B" text-anchor="middle">exit node</text><rect x="250" y="110" width="270" height="230" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="268" y="142" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">1. nftables (CrowdSec)</text><text x="268" y="170" font-size="16"  fill="#33475B" text-anchor="start">Tor list: บล็อกล่วงหน้า</text><text x="268" y="195" font-size="16"  fill="#33475B" text-anchor="start">ssh-bf: บล็อกหลังเดา</text><text x="268" y="220" font-size="16"  fill="#33475B" text-anchor="start">ทุก port · 4–13 ชม.</text><text x="268" y="245" font-size="16"  fill="#33475B" text-anchor="start">บทที่ 9</text><rect x="560" y="110" width="260" height="230" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="578" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">2. firewalld</text><text x="578" y="170" font-size="16"  fill="#33475B" text-anchor="start">zone public</text><text x="578" y="195" font-size="16"  fill="#33475B" text-anchor="start">เปิดเฉพาะ service</text><text x="578" y="220" font-size="16"  fill="#33475B" text-anchor="start">ที่จำเป็น</text><text x="578" y="245" font-size="16"  fill="#33475B" text-anchor="start">บทที่ 2, 4</text><rect x="860" y="110" width="250" height="230" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="878" y="142" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">3. sshd</text><text x="878" y="170" font-size="16"  fill="#33475B" text-anchor="start">key เท่านั้น</text><text x="878" y="195" font-size="16"  fill="#33475B" text-anchor="start">PerSourcePenalties</text><text x="878" y="220" font-size="16"  fill="#33475B" text-anchor="start">MaxAuthTries · AllowGroups</text><text x="878" y="245" font-size="16"  fill="#33475B" text-anchor="start">บทที่ 8</text><rect x="1150" y="110" width="220" height="230" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="1168" y="142" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">4. PAM / IPA</text><text x="1168" y="170" font-size="16"  fill="#33475B" text-anchor="start">HBAC</text><text x="1168" y="195" font-size="16"  fill="#33475B" text-anchor="start">faillock</text><text x="1168" y="220" font-size="16"  fill="#33475B" text-anchor="start">password policy</text><text x="1168" y="245" font-size="16"  fill="#33475B" text-anchor="start">บทที่ 6–7</text><text x="700" y="395" font-size="17" fill="#33475B" text-anchor="middle">ชั้นนอกสุดถูกกว่าและหยุดได้มากที่สุด ชั้นในละเอียดกว่าแต่ต้องให้ connection เข้ามาถึงก่อน</text></svg>
