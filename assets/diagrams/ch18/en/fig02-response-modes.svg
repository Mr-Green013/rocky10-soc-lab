<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>From an alert to a response that fits the severity</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="440" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">From an alert to a response that fits the severity</text><polyline points="280,220 330,220" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="590,200 650,110" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="590,220 650,220" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="590,250 650,330" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="980,110 1040,200" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="980,220 1040,220" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="980,330 1040,250" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="150" width="250" height="140" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="182" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">container alert</text><text x="48" y="210" font-size="16" fill="#33475B" text-anchor="start">rule 1007xx</text><text x="48" y="235" font-size="16" fill="#33475B" text-anchor="start">container name</text><rect x="330" y="150" width="260" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="348" y="182" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">container-response.sh</text><text x="348" y="210" font-size="16" fill="#33475B" text-anchor="start">reads the mode from the rule</text><text x="348" y="235" font-size="16" fill="#33475B" text-anchor="start">checks the label</text><text x="348" y="260" font-size="16" fill="#33475B" text-anchor="start">soc.autoresponse</text><rect x="650" y="60" width="330" height="100" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="668" y="92" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">pause</text><text x="668" y="120" font-size="16" fill="#33475B" text-anchor="start">frozen, evidence kept</text><rect x="650" y="170" width="330" height="100" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="668" y="202" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">stop / kill</text><text x="668" y="230" font-size="16" fill="#FFFFFF" text-anchor="start">stops the service being used to attack</text><rect x="650" y="280" width="330" height="100" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="668" y="312" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">skip (label=off)</text><text x="668" y="340" font-size="16" fill="#33475B" text-anchor="start">still alerts but does not respond</text><rect x="1040" y="150" width="330" height="140" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1058" y="182" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">result comes back as an alert</text><text x="1058" y="210" font-size="16" fill="#33475B" text-anchor="start">rule 10066x</text><text x="1058" y="235" font-size="16" fill="#33475B" text-anchor="start">Graylog SOC Command Center</text></svg>
