<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>สิ่งที่แยก container ออกจาก host และช่องที่ทำให้การแยกหายไป</title>
<defs><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker><marker id="m-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#E76F51"/></marker></defs>
<rect width="1400" height="520" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">สิ่งที่แยก container ออกจาก host และช่องที่ทำให้การแยกหายไป</text><rect x="30" y="80" width="760" height="400" rx="14" fill="none" stroke="#5B6770" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="108" font-size="17" font-weight="700" fill="#33475B">host node-01 (kernel เดียวกัน)</text><polyline points="860,145 810,145 810,175 760,175" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-red)"/><polyline points="860,275 790,275 790,230 760,230" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-red)"/><polyline points="860,405 760,405" fill="none" stroke="#E76F51" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-orange)"/><rect x="60" y="125" width="300" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="78" y="157" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">container</text><text x="78" y="185" font-size="16"  fill="#33475B" text-anchor="start">namespace: pid, net, mnt</text><text x="78" y="210" font-size="16"  fill="#33475B" text-anchor="start">cgroup: memory, pids</text><text x="78" y="235" font-size="16"  fill="#33475B" text-anchor="start">capability ที่ตัดแล้ว</text><rect x="400" y="125" width="360" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="418" y="157" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">ชั้นป้องกันของ host</text><text x="418" y="185" font-size="16"  fill="#33475B" text-anchor="start">seccomp · SELinux (container_t)</text><text x="418" y="210" font-size="16"  fill="#33475B" text-anchor="start">no-new-privileges</text><text x="418" y="235" font-size="16"  fill="#33475B" text-anchor="start">read-only rootfs</text><rect x="60" y="310" width="700" height="140" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="78" y="342" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">kernel</text><text x="78" y="370" font-size="16"  fill="#FFFFFF" text-anchor="start">syscall ทุกตัวของทุก container ผ่านที่นี่</text><text x="78" y="395" font-size="16"  fill="#FFFFFF" text-anchor="start">Falco และ Tetragon (บทที่ 19) เฝ้าตรงนี้</text><rect x="860" y="90" width="510" height="110" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="878" y="122" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">--privileged</text><text x="878" y="150" font-size="16"  fill="#FFFFFF" text-anchor="start">ได้ทุก capability และเข้าถึง device ของ host</text><rect x="860" y="220" width="510" height="110" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="878" y="252" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">mount /var/run/docker.sock</text><text x="878" y="280" font-size="16"  fill="#FFFFFF" text-anchor="start">สั่ง Docker ได้ = สร้าง container ที่เป็น root บน host</text><rect x="860" y="350" width="510" height="110" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="878" y="382" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">ไม่จำกัด memory / pids</text><text x="878" y="410" font-size="16"  fill="#33475B" text-anchor="start">container เดียวทำให้ทั้ง host ล่ม (DoS)</text></svg>
