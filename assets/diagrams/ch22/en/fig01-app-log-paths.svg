<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Three paths for application logs to the app-logs stream</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="480" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Three paths for application logs to the app-logs stream</text><polyline points="360,170 460,170" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="360,232.5 460,232.5" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="360,395 460,395" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="750,232.5 850,232.5" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="750,347.5 850,347.5" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="90" width="330" height="110" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="48" y="122" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">A. code sends GELF itself</text><text x="48" y="150" font-size="16" fill="#33475B" text-anchor="start">orders-api (Python)</text><text x="48" y="175" font-size="16" fill="#33475B" text-anchor="start">all fields from the source</text><rect x="30" y="215" width="330" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="247" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">B. Docker gelf driver</text><text x="48" y="275" font-size="16" fill="#33475B" text-anchor="start">container stdout</text><text x="48" y="300" font-size="16" fill="#33475B" text-anchor="start">gets container_name, image</text><rect x="30" y="340" width="330" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="48" y="372" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">C. file + rsyslog imfile</text><text x="48" y="400" font-size="16" fill="#33475B" text-anchor="start">legacy applications</text><text x="48" y="425" font-size="16" fill="#33475B" text-anchor="start">must be parsed in the pipeline</text><rect x="460" y="140" width="290" height="110" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="478" y="172" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">GELF UDP 12201</text><text x="478" y="200" font-size="16" fill="#33475B" text-anchor="start">input gelf-udp-12201</text><rect x="460" y="340" width="290" height="110" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="478" y="372" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">Syslog TCP 1514</text><text x="478" y="400" font-size="16" fill="#33475B" text-anchor="start">input syslog-tcp-1514</text><rect x="850" y="215" width="520" height="140" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="868" y="247" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">stream app-logs + pipeline App</text><text x="868" y="275" font-size="16" fill="#33475B" text-anchor="start">App-01 normalize · App-02 slow request</text><text x="868" y="300" font-size="16" fill="#33475B" text-anchor="start">App-03 parses legacy-app lines</text><text x="868" y="325" font-size="16" fill="#33475B" text-anchor="start">dashboard Application Health</text></svg>
