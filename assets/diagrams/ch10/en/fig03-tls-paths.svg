<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Two ways into Graylog, and which segments are encrypted</title>
<defs><marker id="m-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1E7D3A"/></marker><marker id="m-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#8A96A3"/></marker></defs>
<rect width="1400" height="440" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Two ways into Graylog, and which segments are encrypted</text><polyline points="250,155 560,155" fill="none" stroke="#1E7D3A" stroke-width="3" marker-end="url(#m-green)"/><text x="405" y="145" font-size="15" text-anchor="middle" fill="#1E7D3A" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">HTTPS (IPA CA)</text><polyline points="820,155 1250,155 1250,180" fill="none" stroke="#8A96A3" stroke-width="3" marker-end="url(#m-gray)"/><polyline points="250,345 300,345" fill="none" stroke="#1E7D3A" stroke-width="3" marker-end="url(#m-green)"/><polyline points="520,345 560,345" fill="none" stroke="#1E7D3A" stroke-width="3" marker-end="url(#m-green)"/><polyline points="820,345 860,345" fill="none" stroke="#8A96A3" stroke-width="3" marker-end="url(#m-gray)"/><polyline points="1080,345 1250,345 1250,310" fill="none" stroke="#8A96A3" stroke-width="3" marker-end="url(#m-gray)"/><rect x="30" y="100" width="220" height="110" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="132" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Windows in the lab</text><text x="48" y="160" font-size="16" fill="#FFFFFF" text-anchor="start">trusts the IPA CA</text><rect x="560" y="100" width="260" height="110" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="578" y="132" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">nginx :443</text><text x="578" y="160" font-size="16" fill="#33475B" text-anchor="start">certificate from IPA</text><rect x="1130" y="180" width="240" height="130" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="1148" y="212" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">graylog :9000</text><text x="1148" y="240" font-size="16" fill="#33475B" text-anchor="start">internal HTTP</text><text x="1148" y="265" font-size="16" fill="#33475B" text-anchor="start">Docker network</text><rect x="30" y="290" width="220" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="48" y="322" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">outside browser</text><text x="48" y="350" font-size="16" fill="#33475B" text-anchor="start">through Cloudflare Access</text><rect x="300" y="290" width="220" height="110" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="318" y="322" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">Cloudflare edge</text><text x="318" y="350" font-size="16" fill="#33475B" text-anchor="start">CF certificate</text><rect x="560" y="290" width="260" height="110" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="578" y="322" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">cloudflared</text><text x="578" y="350" font-size="16" fill="#33475B" text-anchor="start">outbound tunnel</text><rect x="860" y="290" width="220" height="110" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="878" y="322" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">nginx :80</text><text x="878" y="350" font-size="16" fill="#33475B" text-anchor="start">only within the network</text><text x="700" y="430" font-size="16" fill="#33475B" text-anchor="middle">green = encrypted on the network · gray = HTTP only inside graylog-01</text></svg>
