<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Moving agents from 1514 to 1614 step by step</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="400" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Moving agents from 1514 to 1614 step by step</text><polyline points="330,195 370,195" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="690,195 730,195" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1030,195 1070,195" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="110" width="300" height="170" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="142" font-size="18.7" font-weight="700" fill="#1F3A5F" text-anchor="start">1. manager listens on both ports</text><text x="48" y="170" font-size="16" fill="#33475B" text-anchor="start">add &lt;remote&gt; 1614</text><text x="48" y="195" font-size="16" fill="#33475B" text-anchor="start">keep the 1514 block</text><text x="48" y="220" font-size="16" fill="#33475B" text-anchor="start">every agent still Active</text><rect x="370" y="110" width="320" height="170" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="388" y="142" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">2. move agents one at a time</text><text x="388" y="170" font-size="16" fill="#33475B" text-anchor="start">agent-port.sh</text><text x="388" y="195" font-size="16" fill="#33475B" text-anchor="start">wait for Connected …:1614</text><text x="388" y="220" font-size="16" fill="#33475B" text-anchor="start">failed → reverts by itself</text><rect x="730" y="110" width="300" height="170" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="748" y="142" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">3. close the old port</text><text x="748" y="170" font-size="16" fill="#33475B" text-anchor="start">remove &lt;remote&gt; 1514</text><text x="748" y="195" font-size="16" fill="#33475B" text-anchor="start">close 1514 in the firewall</text><text x="748" y="220" font-size="16" fill="#33475B" text-anchor="start">check agent_control -l</text><rect x="1070" y="110" width="300" height="170" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1088" y="142" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">4. restrict sources</text><text x="1088" y="170" font-size="16" fill="#33475B" text-anchor="start">rich rule 1614: lab subnet</text><text x="1088" y="195" font-size="16" fill="#33475B" text-anchor="start">rich rule 8443: .100</text><text x="1088" y="220" font-size="16" fill="#33475B" text-anchor="start">the real protection is this step</text><text x="700" y="340" font-size="17" fill="#C0392B" text-anchor="middle">Snapshot before you start and keep the VM console open: if the rich rule is wrong you cannot reach the machine over the network</text></svg>
