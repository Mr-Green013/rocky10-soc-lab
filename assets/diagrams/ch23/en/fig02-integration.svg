<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>The path of one alert to LINE and Telegram</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="440" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">The path of one alert to LINE and Telegram</text><polyline points="290,195 340,195" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="600,195 650,195" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="950,195 1000,195" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="800,310 800,270" fill="none" stroke="#1F3A5F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-navy)"/><rect x="30" y="120" width="260" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="152" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">wazuh-integratord</text><text x="48" y="180" font-size="16" fill="#33475B" text-anchor="start">reads &lt;integration&gt;</text><text x="48" y="205" font-size="16" fill="#33475B" text-anchor="start">level ≥ threshold</text><text x="48" y="230" font-size="16" fill="#33475B" text-anchor="start">passes the alert JSON file</text><rect x="340" y="120" width="260" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="358" y="152" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">custom-line</text><text x="358" y="180" font-size="16" fill="#33475B" text-anchor="start">shell wrapper</text><text x="358" y="205" font-size="16" fill="#33475B" text-anchor="start">calls custom-line.py</text><text x="358" y="230" font-size="16" fill="#33475B" text-anchor="start">with Wazuh's Python</text><rect x="650" y="120" width="300" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="668" y="152" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">custom-line.py</text><text x="668" y="180" font-size="16" fill="#33475B" text-anchor="start">reads notify.env (640)</text><text x="668" y="205" font-size="16" fill="#33475B" text-anchor="start">checks duplicates from state</text><text x="668" y="230" font-size="16" fill="#33475B" text-anchor="start">sends only the fields needed</text><rect x="1000" y="120" width="370" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1018" y="152" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">api.line.me / api.telegram.org</text><text x="1018" y="180" font-size="16" fill="#33475B" text-anchor="start">HTTPS</text><text x="1018" y="205" font-size="16" fill="#33475B" text-anchor="start">records the result in integrations.log</text><rect x="650" y="310" width="300" height="100" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="668" y="342" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">/var/ossec/etc/notify.env</text><text x="668" y="370" font-size="16" fill="#FFFFFF" text-anchor="start">token and recipients · not in the repo</text></svg>
