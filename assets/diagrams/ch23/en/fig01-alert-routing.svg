<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Which alert levels reach whom</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="520" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Which alert levels reach whom</text><polyline points="270,220 350,120" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="270,245 350,245" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="270,290 350,370" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="300,255 300,470 720,470 720,310 760,310" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="300,470 740,470 740,435 760,435" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1060,310 1110,310" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1060,435 1110,435" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="180" width="240" height="150" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="212" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Wazuh alert</text><text x="48" y="240" font-size="16" fill="#FFFFFF" text-anchor="start">level 0–15</text><text x="48" y="265" font-size="16" fill="#FFFFFF" text-anchor="start">rule, agent, IP, user</text><rect x="350" y="70" width="330" height="100" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="368" y="102" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">Dashboard (every alert)</text><text x="368" y="130" font-size="16" fill="#33475B" text-anchor="start">Wazuh, Graylog</text><rect x="350" y="195" width="330" height="100" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="368" y="227" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Graylog (level ≥ 5)</text><text x="368" y="255" font-size="16" fill="#33475B" text-anchor="start">event definition + notification</text><rect x="350" y="320" width="330" height="100" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="368" y="352" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">Telegram SOC group (≥ 10)</text><text x="368" y="380" font-size="16" fill="#33475B" text-anchor="start">no monthly quota</text><rect x="760" y="260" width="300" height="100" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="778" y="292" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">LINE to individuals (≥ 12)</text><text x="778" y="320" font-size="16" fill="#33475B" text-anchor="start">Messaging API · has a quota</text><rect x="760" y="385" width="300" height="100" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="778" y="417" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">Gmail (≥ 12)</text><text x="778" y="445" font-size="16" fill="#33475B" text-anchor="start">Postfix relay · limited per hour</text><rect x="1110" y="260" width="260" height="225" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1128" y="292" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">de-duplicate</text><text x="1128" y="320" font-size="16" fill="#FFFFFF" text-anchor="start">same rule + agent</text><text x="1128" y="345" font-size="16" fill="#FFFFFF" text-anchor="start">within 5 minutes</text><text x="1128" y="370" font-size="16" fill="#FFFFFF" text-anchor="start">sent once</text></svg>
