<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>วงจรการโจมตีและจุดที่แลปนี้ตรวจจับได้</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="320" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">วงจรการโจมตีและจุดที่แลปนี้ตรวจจับได้</text><polyline points="195,185 210,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="380,185 395,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="575,185 590,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="770,185 785,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="965,185 980,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1160,185 1175,185" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="15" y="110" width="180" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="33" y="142" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">1. ลาดตระเวน</text><text x="33" y="170" font-size="16"  fill="#33475B" text-anchor="start">สแกน port/เว็บ</text><text x="33" y="195" font-size="16"  fill="#33475B" text-anchor="start">Graylog, CrowdSec</text><rect x="210" y="110" width="170" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="228" y="142" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">2. สร้างอาวุธ</text><text x="228" y="170" font-size="16"  fill="#33475B" text-anchor="start">ทำ offline</text><text x="228" y="195" font-size="16"  fill="#33475B" text-anchor="start">ไม่มีร่องรอย</text><rect x="395" y="110" width="180" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="413" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">3. ส่ง/เข้าถึง</text><text x="413" y="170" font-size="16"  fill="#33475B" text-anchor="start">คำขอ exploit</text><text x="413" y="195" font-size="16"  fill="#33475B" text-anchor="start">WAF, mail/web log</text><rect x="590" y="110" width="180" height="150" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="608" y="142" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">4. เจาะระบบ</text><text x="608" y="170" font-size="16"  fill="#FFFFFF" text-anchor="start">web→shell, egress</text><text x="608" y="195" font-size="16"  fill="#FFFFFF" text-anchor="start">Falco, Tetragon</text><rect x="785" y="110" width="180" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="803" y="142" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">5. ฝังตัว</text><text x="803" y="170" font-size="16"  fill="#33475B" text-anchor="start">cron/SUID/key</text><text x="803" y="195" font-size="16"  fill="#33475B" text-anchor="start">FIM, auditd</text><rect x="980" y="110" width="180" height="150" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="998" y="142" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">6. C2</text><text x="998" y="170" font-size="16"  fill="#FFFFFF" text-anchor="start">beacon ขาออก</text><text x="998" y="195" font-size="16"  fill="#FFFFFF" text-anchor="start">Tetragon egress</text><rect x="1175" y="110" width="205" height="150" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1193" y="142" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">7. ลงมือ</text><text x="1193" y="170" font-size="16"  fill="#33475B" text-anchor="start">ขโมย/ลบข้อมูล</text><text x="1193" y="195" font-size="16"  fill="#33475B" text-anchor="start">ransomware rule, egress</text></svg>
