<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ตัวตรวจจับ 3 ชั้นของห้องแลป และ CVE ที่แต่ละชั้นจับได้</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="540" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ตัวตรวจจับ 3 ชั้นของห้องแลป และ CVE ที่แต่ละชั้นจับได้</text><polyline points="250,290 320,130" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="250,300 320,290" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="250,310 320,450" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="740,130 820,230" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="740,290 820,270" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="740,450 820,310" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1080,270 1150,270" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="230" width="220" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="48" y="262" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">เหตุการณ์จำลอง</text><text x="48" y="290" font-size="16"  fill="#33475B" text-anchor="start">สัญญาณของ CVE</text><text x="48" y="315" font-size="16"  fill="#33475B" text-anchor="start">คำสั่งปกติใน lab</text><rect x="320" y="70" width="420" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="338" y="102" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">ชั้นเครือข่าย / log</text><text x="338" y="130" font-size="16"  fill="#33475B" text-anchor="start">Graylog + rsyslog, CrowdSec</text><text x="338" y="155" font-size="16"  fill="#33475B" text-anchor="start">regreSSHion, Log4Shell (ปลายทางขาออก)</text><rect x="320" y="230" width="420" height="120" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="338" y="262" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">ชั้น host (syscall / ไฟล์)</text><text x="338" y="290" font-size="16"  fill="#33475B" text-anchor="start">auditd + Wazuh FIM</text><text x="338" y="315" font-size="16"  fill="#33475B" text-anchor="start">PwnKit, xz/liblzma, Shellshock</text><rect x="320" y="390" width="420" height="120" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="338" y="422" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">ชั้น kernel (eBPF)</text><text x="338" y="450" font-size="16"  fill="#FFFFFF" text-anchor="start">Falco + Tetragon</text><text x="338" y="475" font-size="16"  fill="#FFFFFF" text-anchor="start">Log4Shell (egress), Struts2, Shellshock</text><rect x="820" y="150" width="260" height="240" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="838" y="182" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">Wazuh manager</text><text x="838" y="210" font-size="16"  fill="#33475B" text-anchor="start">decoder + rule</text><text x="838" y="235" font-size="16"  fill="#33475B" text-anchor="start">alert + MITRE</text><rect x="1150" y="150" width="220" height="240" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1168" y="182" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">Graylog + มือถือ</text><text x="1168" y="210" font-size="16"  fill="#33475B" text-anchor="start">dashboard</text><text x="1168" y="235" font-size="16"  fill="#33475B" text-anchor="start">detection coverage</text></svg>
