<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>Detection layers along the path of a web app request</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="360" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">Detection layers along the path of a web app request</text><polyline points="200,190 240,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="480,190 520,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="760,190 800,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="1040,190 1080,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="20" y="130" width="180" height="120" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="38" y="162" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">request</text><text x="38" y="190" font-size="16" fill="#33475B" text-anchor="start">from users/scanners</text><rect x="240" y="120" width="240" height="140" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="258" y="152" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">WAF (Lab 32)</text><text x="258" y="180" font-size="16" fill="#FFFFFF" text-anchor="start">ModSecurity + CRS</text><text x="258" y="205" font-size="16" fill="#FFFFFF" text-anchor="start">A03 injection, A10 SSRF</text><text x="258" y="230" font-size="16" fill="#FFFFFF" text-anchor="start">scanners, traversal</text><rect x="520" y="120" width="240" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="538" y="152" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Nginx (Lab 30)</text><text x="538" y="180" font-size="16" fill="#33475B" text-anchor="start">access log → Graylog</text><text x="538" y="205" font-size="16" fill="#33475B" text-anchor="start">A01 403/admin, A07 auth fail</text><rect x="800" y="120" width="240" height="140" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="818" y="152" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">WordPress/PHP</text><text x="818" y="180" font-size="16" fill="#33475B" text-anchor="start">Wazuh rule (Lab 29)</text><text x="818" y="205" font-size="16" fill="#33475B" text-anchor="start">A08 integrity (FIM)</text><rect x="1080" y="120" width="290" height="140" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="1098" y="152" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Tetragon (ch. 19)</text><text x="1098" y="180" font-size="16" fill="#FFFFFF" text-anchor="start">wp-no-shell: kills the shell</text><text x="1098" y="205" font-size="16" fill="#FFFFFF" text-anchor="start">egress: A10 outbound SSRF</text></svg>
