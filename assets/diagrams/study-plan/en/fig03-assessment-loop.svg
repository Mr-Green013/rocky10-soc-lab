ont-size="16" fill="#33475B" text-anchor="middle">rubric, 4 areas ≥ 75%</text><line x1="1089" y1="165" x2="1119" y2="165" stroke="#1F3A5F" stroke-width="3" marker-end="url(#a)"/><rect x="1125" y="90" width="230" height="150" rx="12" fill="#F6F7F9" stroke="#1E7D3A" stroke-width="2.5"/><text x="1240" y="134" font-size="20" font-weight="700" fill="#1E7D3A" text-anchor="middle">Capstone + Portfolio</text><text x="1240" y="174" font-size="16" fill="#33475B" text-anchor="middle">days 59–60</text><text x="1240" y="204" font-size="16" fill="#33475B" text-anchor="middle">end-to-end simulated incident</text><path d="M970 244 V320 H160 V250" fill="none" stroke="#E76F51" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/><path d="M430 244 V320" fill="none" stroke="#E76F51" stroke-width="2.5" stroke-dasharray="7 5"/><text x="685" y="348" font-size="16" font-weight="700" fill="#E76F51" text-anchor="middle">Not passed: roll back to the chapter snapshot, fix it with "Troubleshooting", then do it again</text></svg>
