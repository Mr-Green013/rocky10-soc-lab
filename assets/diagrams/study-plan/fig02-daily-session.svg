<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430">
<rect width="1400" height="430" fill="#fff"/>
<text x="70" y="44" font-size="26" font-weight="700" fill="#1F3A5F">โครงสร้างการเรียน 1 วัน (120 นาที)</text><rect x="70" y="80" width="102" height="64" fill="#5B6770"/><text x="121" y="120" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">10′</text><line x1="121" y1="144" x2="196" y2="200" stroke="#5B6770" stroke-width="2"/><rect x="78" y="200" width="236" height="190" rx="10" fill="#F6F7F9" stroke="#5B6770" stroke-width="2"/><text x="196" y="236" font-size="20" font-weight="700" fill="#5B6770" text-anchor="middle">เตรียม</text><text x="196" y="274" font-size="16" fill="#33475B" text-anchor="middle">เปิด lab ตามลำดับ</text><text x="196" y="306" font-size="16" fill="#33475B" text-anchor="middle">ตรวจว่าอยู่ snapshot ที่ถูก</text><text x="196" y="338" font-size="16" fill="#33475B" text-anchor="middle">อ่านเป้าหมายของวัน</text><rect x="175" y="80" width="259.5" height="64" fill="#1F3A5F"/><text x="304.75" y="120" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">25′</text><line x1="304.75" y1="144" x2="448" y2="200" stroke="#1F3A5F" stroke-width="2"/><rect x="330" y="200" width="236" height="190" rx="10" fill="#F6F7F9" stroke="#1F3A5F" stroke-width="2"/><text x="448" y="236" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">ทฤษฎี</text><text x="448" y="274" font-size="16" fill="#33475B" text-anchor="middle">อ่านหัวข้อ "ทฤษฎี" ของบท</text><text x="448" y="306" font-size="16" fill="#33475B" text-anchor="middle">ตอบให้ได้ว่าทำไมต้องทำ</text><text x="448" y="338" font-size="16" fill="#33475B" text-anchor="middle">จดคำศัพท์ใหม่</text><rect x="437.5" y="80" width="574.5" height="64" fill="#2A9D8F"/><text x="724.75" y="120" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">55′</text><line x1="724.75" y1="144" x2="700" y2="200" stroke="#2A9D8F" stroke-width="2"/><rect x="582" y="200" width="236" height="190" rx="10" fill="#F6F7F9" stroke="#2A9D8F" stroke-width="2"/><text x="700" y="236" font-size="20" font-weight="700" fill="#2A9D8F" text-anchor="middle">ปฏิบัติ</text><text x="700" y="274" font-size="16" fill="#33475B" text-anchor="middle">ทำขั้นตอนตามแผน</text><text x="700" y="306" font-size="16" fill="#33475B" text-anchor="middle">รันคำสั่งหลักทีละบรรทัด</text><text x="700" y="338" font-size="16" fill="#33475B" text-anchor="middle">จดสิ่งที่ผิดจากที่คาด</text><rect x="1015" y="80" width="154.5" height="64" fill="#B45309"/><text x="1092.25" y="120" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">15′</text><line x1="1092.25" y1="144" x2="952" y2="200" stroke="#B45309" stroke-width="2"/><rect x="834" y="200" width="236" height="190" rx="10" fill="#F6F7F9" stroke="#B45309" stroke-width="2"/><text x="952" y="236" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">แบบฝึกหัด</text><text x="952" y="274" font-size="16" fill="#33475B" text-anchor="middle">ทำโจทย์ของวันเอง</text><text x="952" y="306" font-size="16" fill="#33475B" text-anchor="middle">ไม่ดูแนวคำตอบก่อน</text><text x="952" y="338" font-size="16" fill="#33475B" text-anchor="middle">ทดลองนอกเหนือขั้นตอน</text><rect x="1172.5" y="80" width="154.5" height="64" fill="#E76F51"/><text x="1249.75" y="120" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">15′</text><line x1="1249.75" y1="144" x2="1204" y2="200" stroke="#E76F51" stroke-width="2"/><rect x="1086" y="200" width="236" height="190" rx="10" fill="#F6F7F9" stroke="#E76F51" stroke-width="2"/><text x="1204" y="236" font-size="20" font-weight="700" fill="#E76F51" text-anchor="middle">ตรวจ + บันทึก</text><text x="1204" y="274" font-size="16" fill="#33475B" text-anchor="middle">เทียบเกณฑ์ผ่าน</text><text x="1204" y="306" font-size="16" fill="#33475B" text-anchor="middle">เก็บหลักฐานลง portfolio</text><text x="1204" y="338" font-size="16" fill="#33475B" text-anchor="middle">ให้คะแนนตัวเองด้วย Rubric</text><text x="70" y="412" font-size="14" fill="#5B6770">วันที่ไม่เสร็จในเวลา: หยุดที่ขั้นตอนที่ตรวจผ่านล่าสุด บันทึกจุดที่ค้าง แล้วทำต่อวันถัดไปก่อนเริ่มหัวข้อใหม่</text></svg>