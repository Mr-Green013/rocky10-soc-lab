<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>One change to /etc/sudoers.d/ seen by the three FIM modes</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="500" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">One change to /etc/sudoers.d/ seen by the three FIM modes</text><polyline points="280,220 340,125" fill="none" stroke="#1F3A5F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-navy)"/><polyline points="280,250 340,250" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="280,280 340,390" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="820,390 860,390 860,300 900,300" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="820,250 900,250" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><rect x="30" y="180" width="250" height="130" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="212" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">aod runs</text><text x="48" y="240" font-size="16" fill="#FFFFFF" text-anchor="start">sudo visudo -f</text><text x="48" y="265" font-size="16" fill="#FFFFFF" text-anchor="start">/etc/sudoers.d/99-x</text><rect x="340" y="70" width="480" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="358" y="102" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">scheduled (default 12 h)</text><text x="358" y="130" font-size="16" fill="#33475B" text-anchor="start">known at the next scan · hash changed · who is unknown</text><rect x="340" y="195" width="480" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="358" y="227" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">realtime (inotify)</text><text x="358" y="255" font-size="16" fill="#33475B" text-anchor="start">known at once · hash changed · who is unknown</text><rect x="340" y="320" width="480" height="140" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="358" y="352" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">whodata (auditd: key wazuh_fim)</text><text x="358" y="380" font-size="16" fill="#33475B" text-anchor="start">known at once · user=root · login_user=aod</text><text x="358" y="405" font-size="16" fill="#33475B" text-anchor="start">process=/usr/sbin/visudo · ppid of sudo</text><rect x="900" y="195" width="470" height="160" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="918" y="227" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">alert from rule 100403</text><text x="918" y="255" font-size="16" fill="#FFFFFF" text-anchor="start">sudo policy changed: /etc/sudoers.d/99-x</text><text x="918" y="280" font-size="16" fill="#FFFFFF" text-anchor="start">level 12 · report_changes shows the added line</text><text x="918" y="305" font-size="16" fill="#FFFFFF" text-anchor="start">audit.login_user points to the person</text></svg>
