<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
  <title>Figure 3-1 The time hierarchy in the lab</title>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1F3A5F"/></marker></defs>
  <rect width="1400" height="660" fill="#fff"/>
  <g font-size="17" fill="#33475B">
    <rect x="380" y="30" width="640" height="100" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/>
    <text x="400" y="66" font-size="20" font-weight="700" fill="#1F3A5F">NTP on the internet (stratum 1–2)</text>
    <text x="400" y="98">th.pool.ntp.org · time.cloudflare.com · the Debian pool</text>
    <rect x="380" y="200" width="640" height="130" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/>
    <text x="400" y="236" font-size="20" font-weight="700" fill="#1F3A5F">pve-01: chrony is the lab's NTP server</text>
    <text x="400" y="268" font-family="monospace" font-size="15">allow 192.168.10.0/24     local stratum 10</text>
    <text x="400" y="298">if the internet is down, every machine still gets the same time</text>
    <text x="400" y="320" font-size="15" fill="#5B6770">Hyper-V Time Synchronization also sets the clock at boot</text>
  </g>
  <g font-size="16" fill="#1F3A5F" text-anchor="middle">
    <rect x="40" y="420" width="200" height="80" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/><text x="140" y="452" font-weight="700">ipa-01</text><text x="140" y="478">chronyd</text>
    <rect x="265" y="420" width="200" height="80" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/><text x="365" y="452" font-weight="700">graylog-01</text><text x="365" y="478">chronyd</text>
    <rect x="490" y="420" width="200" height="80" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/><text x="590" y="452" font-weight="700">wazuh-01</text><text x="590" y="478">chronyd</text>
    <rect x="715" y="420" width="200" height="80" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/><text x="815" y="452" font-weight="700">lab-linux-01</text><text x="815" y="478">chronyd</text>
    <rect x="940" y="420" width="200" height="80" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/><text x="1040" y="452" font-weight="700">lab-linux-02</text><text x="1040" y="478">chronyd</text>
    <rect x="1165" y="420" width="200" height="80" rx="10" fill="#fff" stroke="#2A9D8F" stroke-width="2"/><text x="1265" y="452" font-weight="700">node-01</text><text x="1265" y="478">chronyd</text>
  </g>
  <g stroke="#1F3A5F" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="700" y1="132" x2="700" y2="196"/>
    <line x1="700" y1="332" x2="140" y2="416"/><line x1="700" y1="332" x2="365" y2="416"/><line x1="700" y1="332" x2="590" y2="416"/>
    <line x1="700" y1="332" x2="815" y2="416"/><line x1="700" y1="332" x2="1040" y2="416"/><line x1="700" y1="332" x2="1265" y2="416"/>
  </g>
  <text x="720" y="172" font-size="15" fill="#5B6770">UDP 123 through NAT</text>
  <text x="40" y="550" font-size="16" fill="#5B6770">every machine: server 192.168.10.1 iburst prefer, with pool th.pool.ntp.org as backup</text>
  <rect x="40" y="570" width="1325" height="70" rx="10" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/>
  <text x="60" y="602" font-size="17" font-weight="700" fill="#1F3A5F">Why a SOC needs one clock:</text>
  <text x="330" y="602" font-size="17" fill="#33475B">Kerberos refuses skew over 5 minutes (chapter 7) · the SIEM orders a cross-machine timeline wrongly</text>
  <text x="330" y="628" font-size="17" fill="#33475B">(chapters 10–13) · TLS checks certificate expiry wrongly</text>
</svg>
