<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
  <title>Figure 1-3 From an ISO to 6 machines with a golden image and cloud-init</title>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1F3A5F"/></marker>
  </defs>
  <rect width="1400" height="640" fill="#FFFFFF"/>

  <g font-size="16" fill="#33475B">
    <!-- row 1 -->
    <rect x="40" y="50" width="300" height="190" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/>
    <rect x="40" y="50" width="96" height="32" rx="8" fill="#5B6770"/><text x="88" y="72" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 8</text>
    <text x="60" y="118" font-size="20" font-weight="700" fill="#1F3A5F">Rocky Linux 10 ISO</text>
    <text x="60" y="148">minimal ISO + SHA-256 check</text>
    <text x="60" y="174">stored in Proxmox local:iso</text>

    <rect x="380" y="50" width="300" height="190" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="380" y="50" width="96" height="32" rx="8" fill="#1F3A5F"/><text x="428" y="72" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 8</text>
    <text x="400" y="118" font-size="20" font-weight="700" fill="#1F3A5F">VM 9000 rocky10-golden</text>
    <text x="400" y="148">install from the ISO (Lab 1)</text>
    <text x="400" y="174">CPU type = host</text>
    <text x="400" y="200">temporary IP 192.168.10.99</text>

    <rect x="720" y="50" width="300" height="190" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/>
    <rect x="720" y="50" width="96" height="32" rx="8" fill="#E76F51"/><text x="768" y="72" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 9</text>
    <text x="740" y="118" font-size="20" font-weight="700" fill="#1F3A5F">golden-prep.sh</text>
    <text x="740" y="148">+ cloud-init, qemu-guest-agent</text>
    <text x="740" y="174">− machine-id, SSH host key</text>
    <text x="740" y="200">− NetworkManager profile, log</text>

    <rect x="1060" y="50" width="300" height="190" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="1060" y="50" width="96" height="32" rx="8" fill="#1F3A5F"/><text x="1108" y="72" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 9</text>
    <text x="1080" y="118" font-size="20" font-weight="700" fill="#1F3A5F">Template rocky10-tpl</text>
    <text x="1080" y="148">qm template 9000</text>
    <text x="1080" y="174">+ cloud-init drive (ide2)</text>
    <text x="1080" y="200">read-only, used only for cloning</text>

    <!-- row 2 -->
    <rect x="40" y="330" width="300" height="190" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/>
    <rect x="40" y="330" width="110" height="32" rx="8" fill="#1F3A5F"/><text x="95" y="352" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 10</text>
    <text x="60" y="398" font-size="20" font-weight="700" fill="#1F3A5F">qm clone × 6 (full)</text>
    <text x="60" y="428">per-machine cloud-init: user aod,</text>
    <text x="60" y="454">SSH public key, password hash,</text>
    <text x="60" y="480">IP from lab-hosts.csv</text>

    <rect x="380" y="330" width="300" height="190" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/>
    <rect x="380" y="330" width="110" height="32" rx="8" fill="#2A9D8F"/><text x="435" y="352" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 10</text>
    <text x="400" y="398" font-size="20" font-weight="700" fill="#1F3A5F">first boot</text>
    <text x="400" y="428">cloud-init creates a new machine-id,</text>
    <text x="400" y="454">SSH host key, hostname, IP</text>
    <text x="400" y="480">and new authorized_keys</text>

    <rect x="720" y="330" width="300" height="190" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/>
    <rect x="720" y="330" width="110" height="32" rx="8" fill="#E76F51"/><text x="775" y="352" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 11</text>
    <text x="740" y="398" font-size="20" font-weight="700" fill="#1F3A5F">post-clone.sh</text>
    <text x="740" y="428">grow partition → PV → LV → XFS</text>
    <text x="740" y="454">disable cloud-init</text>
    <text x="740" y="480">install soclab-check</text>

    <rect x="1060" y="330" width="300" height="190" rx="12" fill="#1F3A5F"/>
    <rect x="1060" y="330" width="110" height="32" rx="8" fill="#E76F51"/><text x="1115" y="352" fill="#FFFFFF" font-weight="700" text-anchor="middle">Step 12</text>
    <text x="1080" y="398" font-size="20" font-weight="700" fill="#FFFFFF">snapshot ch01-base</text>
    <text x="1080" y="428" fill="#DCE6F2">starting point of chapter 2</text>
    <text x="1080" y="454" fill="#DCE6F2">roll back any time</text>
    <text x="1080" y="480" fill="#DCE6F2">pve-snapshot.sh</text>
  </g>

  <g stroke="#1F3A5F" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="342" y1="145" x2="376" y2="145"/>
    <line x1="682" y1="145" x2="716" y2="145"/>
    <line x1="1022" y1="145" x2="1056" y2="145"/>
    <polyline points="1210,242 1210,286 190,286 190,326"/>
    <line x1="342" y1="425" x2="376" y2="425"/>
    <line x1="682" y1="425" x2="716" y2="425"/>
    <line x1="1022" y1="425" x2="1056" y2="425"/>
  </g>

  <text x="40" y="582" font-size="18" fill="#1F3A5F" font-weight="700">Golden image principle:</text>
  <text x="250" y="582" font-size="18" fill="#33475B">whatever must be unique per machine is removed before making the template and recreated at each clone's first boot</text>
  <text x="40" y="612" font-size="16" fill="#5B6770">− = removed before making the template · + = added</text>
</svg>
