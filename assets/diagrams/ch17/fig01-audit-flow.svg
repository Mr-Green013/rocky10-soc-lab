<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>จาก syscall หนึ่งครั้งสู่ alert และการสืบสวน</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="500" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">จาก syscall หนึ่งครั้งสู่ alert และการสืบสวน</text><polyline points="290,230 340,230" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="580,200 640,135" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="580,260 640,315" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="970,135 1030,200" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="970,315 1030,260" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="150" width="260" height="160" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="182" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">kernel audit</text><text x="48" y="210" font-size="16"  fill="#FFFFFF" text-anchor="start">rule ที่โหลดด้วย augenrules</text><text x="48" y="235" font-size="16"  fill="#FFFFFF" text-anchor="start">ตรวจทุก syscall ที่ตรง</text><text x="48" y="260" font-size="16"  fill="#FFFFFF" text-anchor="start">ใส่ auid, ses, exe, key</text><rect x="340" y="150" width="240" height="160" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="358" y="182" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">auditd</text><text x="358" y="210" font-size="16"  fill="#33475B" text-anchor="start">/var/log/audit/audit.log</text><text x="358" y="235" font-size="16"  fill="#33475B" text-anchor="start">SYSCALL, EXECVE, PATH</text><text x="358" y="260" font-size="16"  fill="#33475B" text-anchor="start">PROCTITLE (hex)</text><rect x="640" y="70" width="330" height="130" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="658" y="102" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">Wazuh agent</text><text x="658" y="130" font-size="16"  fill="#33475B" text-anchor="start">อ่าน audit.log</text><text x="658" y="155" font-size="16"  fill="#33475B" text-anchor="start">rule 1003xx ตาม key</text><text x="658" y="180" font-size="16"  fill="#33475B" text-anchor="start">MITRE ID ใน alert</text><rect x="640" y="250" width="330" height="130" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="658" y="282" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">audisp-syslog → Graylog</text><text x="658" y="310" font-size="16"  fill="#33475B" text-anchor="start">บทที่ 11</text><text x="658" y="335" font-size="16"  fill="#33475B" text-anchor="start">decoder proctitle (ส่วน C)</text><rect x="1030" y="150" width="340" height="160" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1048" y="182" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">การสืบสวน</text><text x="1048" y="210" font-size="16"  fill="#33475B" text-anchor="start">ausearch -k &lt;key&gt; --session N</text><text x="1048" y="235" font-size="16"  fill="#33475B" text-anchor="start">aureport --summary</text><text x="1048" y="260" font-size="16"  fill="#33475B" text-anchor="start">dashboard SOC Critical</text></svg>
