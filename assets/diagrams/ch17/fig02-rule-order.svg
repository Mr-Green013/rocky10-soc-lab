<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ไฟล์ใน /etc/audit/rules.d/ เรียงตามชื่อ (augenrules)</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker></defs>
<rect width="1400" height="430" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ไฟล์ใน /etc/audit/rules.d/ เรียงตามชื่อ (augenrules)</text><polyline points="280,175 300,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="550,175 570,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="820,175 840,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="1090,175 1110,175" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><rect x="30" y="100" width="250" height="150" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="132" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">10-base.rules</text><text x="48" y="160" font-size="16"  fill="#33475B" text-anchor="start">-D ล้าง rule เดิม</text><text x="48" y="185" font-size="16"  fill="#33475B" text-anchor="start">backlog, failure mode</text><rect x="300" y="100" width="250" height="150" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="318" y="132" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">20-exclude.rules</text><text x="318" y="160" font-size="16"  fill="#33475B" text-anchor="start">ตัด record ขยะ</text><text x="318" y="185" font-size="16"  fill="#33475B" text-anchor="start">และ exe ที่รันถี่</text><rect x="570" y="100" width="250" height="150" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="588" y="132" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">26-web / 30-soc</text><text x="588" y="160" font-size="16"  fill="#33475B" text-anchor="start">rule เจาะจงตาม key</text><text x="588" y="185" font-size="16"  fill="#33475B" text-anchor="start">identity, modules, ...</text><rect x="840" y="100" width="250" height="150" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="858" y="132" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">40-cis.rules</text><text x="858" y="160" font-size="16"  fill="#33475B" text-anchor="start">หมวด 23.10–23.27</text><text x="858" y="185" font-size="16"  fill="#33475B" text-anchor="start">time, identity, mounts</text><rect x="1110" y="100" width="260" height="150" rx="12" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="1128" y="132" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">99-finalize.rules</text><text x="1128" y="160" font-size="16"  fill="#FFFFFF" text-anchor="start">rule wazuh_fim</text><text x="1128" y="185" font-size="16"  fill="#FFFFFF" text-anchor="start">-e 2 (บรรทัดสุดท้าย)</text><text x="700" y="320" font-size="17" fill="#C0392B" text-anchor="middle" font-weight="700">หลัง -e 2 การเปลี่ยน rule ต้อง reboot · ทดสอบชุด rule ให้ครบก่อนเปิด -e 2 ทุกครั้ง</text><text x="700" y="360" font-size="16" fill="#33475B" text-anchor="middle">ตรวจด้วย sudo auditctl -s ว่า enabled 2 และ lost 0</text></svg>
