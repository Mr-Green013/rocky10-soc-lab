<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>ลำดับที่ปลอดภัยในการเปลี่ยนจาก allow_all เป็น HBAC เฉพาะงาน</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker></defs>
<rect width="1400" height="380" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">ลำดับที่ปลอดภัยในการเปลี่ยนจาก allow_all เป็น HBAC เฉพาะงาน</text><polyline points="310,180 350,180" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="630,180 750,180" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><text x="690" y="170" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">ผลตรงทุกกรณี</text><polyline points="1080,180 1120,180" fill="none" stroke="#1F3A5F" stroke-width="3"  marker-end="url(#m-navy)"/><polyline points="490,250 490,320 170,320 170,250" fill="none" stroke="#C0392B" stroke-width="3"  marker-end="url(#m-red)"/><text x="330" y="310" font-size="15" text-anchor="middle" fill="#C0392B" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">ผลไม่ตรง: แก้ rule</text><rect x="30" y="110" width="280" height="140" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="48" y="142" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">1. สร้าง rule ทดแทน</text><text x="48" y="170" font-size="16"  fill="#33475B" text-anchor="start">allow_admins (ทุกเครื่อง)</text><text x="48" y="195" font-size="16"  fill="#33475B" text-anchor="start">allow_sysadmins_web</text><rect x="350" y="110" width="280" height="140" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="368" y="142" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">2. hbactest</text><text x="368" y="170" font-size="16"  fill="#33475B" text-anchor="start">จำลองทุกกรณีที่ต้องเข้าได้</text><text x="368" y="195" font-size="16"  fill="#33475B" text-anchor="start">และทุกกรณีที่ต้องถูกปฏิเสธ</text><rect x="750" y="110" width="330" height="140" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="768" y="142" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">3. ปิด allow_all</text><text x="768" y="170" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">ipa hbacrule-disable allow_all</text><text x="768" y="195" font-size="16"  fill="#33475B" text-anchor="start">เปิด session สำรองค้างไว้</text><rect x="1120" y="110" width="250" height="140" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1138" y="142" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">4. ทดสอบจริง</text><text x="1138" y="170" font-size="16"  fill="#33475B" text-anchor="start">ssh ทุกกรณี</text><text x="1138" y="195" font-size="16"  fill="#33475B" text-anchor="start">ค่าค้างใน cache ให้รัน</text><text x="1138" y="220" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">sss_cache -E</text></svg>
