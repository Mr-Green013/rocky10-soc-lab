<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>FreeIPA components in the lab</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-teal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2A9D8F"/></marker></defs>
<rect width="1400" height="600" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">FreeIPA components in the lab</text><rect x="30" y="80" width="690" height="490" rx="14" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="8 6"/><text x="46" y="108" font-size="17" font-weight="700" fill="#1F3A5F">ipa-01.lab.internal (192.168.10.10)</text><rect x="940" y="80" width="430" height="490" rx="14" fill="none" stroke="#2A9D8F" stroke-width="2" stroke-dasharray="8 6"/><text x="956" y="108" font-size="17" font-weight="700" fill="#1B6F65">every client joined to the domain</text><polyline points="965,175 720,175" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="842.5" y="163" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">LDAP (SASL/GSSAPI)</text><polyline points="965,225 720,225" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="842.5" y="247" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">Kerberos</text><polyline points="1155,290 1155,260" fill="none" stroke="#2A9D8F" stroke-width="3" marker-end="url(#m-teal)"/><polyline points="1155,430 1155,400" fill="none" stroke="#2A9D8F" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-teal)"/><rect x="60" y="130" width="300" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="78" y="162" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">389 Directory Server</text><text x="78" y="190" font-size="16" fill="#33475B" text-anchor="start">LDAP 389 / LDAPS 636</text><text x="78" y="215" font-size="16" fill="#33475B" text-anchor="start">user, group, HBAC, sudo, SSH key</text><rect x="390" y="130" width="300" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="408" y="162" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">MIT Kerberos KDC</text><text x="408" y="190" font-size="16" fill="#33475B" text-anchor="start">88, 464</text><text x="408" y="215" font-size="16" fill="#33475B" text-anchor="start">tickets for single sign-on</text><rect x="60" y="280" width="300" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="78" y="312" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">Dogtag CA</text><text x="78" y="340" font-size="16" fill="#33475B" text-anchor="start">host/service certificates</text><text x="78" y="365" font-size="16" fill="#33475B" text-anchor="start">/etc/ipa/ca.crt on every client</text><rect x="390" y="280" width="300" height="120" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="408" y="312" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">BIND DNS</text><text x="408" y="340" font-size="16" fill="#33475B" text-anchor="start">53 · zone lab.internal</text><text x="408" y="365" font-size="16" fill="#33475B" text-anchor="start">SRV records let clients find the server</text><rect x="60" y="430" width="630" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="78" y="462" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">httpd: Web UI + JSON-RPC API (443)</text><text x="78" y="490" font-size="16" fill="#33475B" text-anchor="start">the ipa command and the Web UI use the same API</text><rect x="965" y="130" width="380" height="130" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="983" y="162" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">SSSD</text><text x="983" y="190" font-size="16" fill="#33475B" text-anchor="start">NSS: getent, id</text><text x="983" y="215" font-size="16" fill="#33475B" text-anchor="start">PAM: pam_sss (auth, HBAC)</text><text x="983" y="240" font-size="16" fill="#33475B" text-anchor="start">cache for offline use</text><rect x="965" y="290" width="380" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="983" y="322" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">sshd</text><text x="983" y="350" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">AuthorizedKeysCommand</text><text x="983" y="375" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" fill="#33475B" text-anchor="start">sss_ssh_authorizedkeys</text><rect x="965" y="430" width="380" height="110" rx="12" fill="#F1F1F4" stroke="#5B6770" stroke-width="2"/><text x="983" y="462" font-size="19" font-weight="700" fill="#33475B" text-anchor="start">sudo</text><text x="983" y="490" font-size="16" fill="#33475B" text-anchor="start">nsswitch.conf: sudoers: files sss</text><text x="983" y="515" font-size="16" fill="#33475B" text-anchor="start">rules from IPA</text></svg>
