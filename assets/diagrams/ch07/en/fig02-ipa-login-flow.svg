<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif">
<title>somsak's login sequence to lab-linux-01</title>
<defs><marker id="m-navy" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F3A5F"/></marker><marker id="m-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#C0392B"/></marker></defs>
<rect width="1400" height="470" fill="#fff"/><text x="40" y="46" font-size="26" font-weight="700" fill="#1F3A5F">somsak's login sequence to lab-linux-01</text><polyline points="180,190 220,190" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="460,145 530,145" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="495" y="135" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">pass</text><polyline points="770,145 880,145" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><text x="825" y="135" font-size="15" text-anchor="middle" fill="#1F3A5F" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="5">allow</text><polyline points="1110,145 1160,145" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#m-navy)"/><polyline points="340,200 340,300" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#m-red)"/><polyline points="650,200 650,300" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#m-red)"/><rect x="30" y="180" width="150" height="110" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="105" y="227.65" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">somsak</text><text x="105" y="255.65" font-size="16" fill="#FFFFFF" text-anchor="middle">ssh from a client</text><rect x="220" y="90" width="240" height="110" rx="12" fill="#EAF0F8" stroke="#1F3A5F" stroke-width="2"/><text x="238" y="122" font-size="19" font-weight="700" fill="#1F3A5F" text-anchor="start">1. authenticate</text><text x="238" y="150" font-size="16" fill="#33475B" text-anchor="start">SSH key from IPA</text><text x="238" y="175" font-size="16" fill="#33475B" text-anchor="start">or password → Kerberos</text><rect x="530" y="90" width="240" height="110" rx="12" fill="#FDF0EC" stroke="#E76F51" stroke-width="2"/><text x="548" y="122" font-size="19" font-weight="700" fill="#B5462B" text-anchor="start">2. HBAC (account)</text><text x="548" y="150" font-size="16" fill="#33475B" text-anchor="start">a rule allows access</text><text x="548" y="175" font-size="16" fill="#33475B" text-anchor="start">to this host via sshd?</text><rect x="880" y="90" width="230" height="110" rx="12" fill="#E8F5F3" stroke="#2A9D8F" stroke-width="2"/><text x="898" y="122" font-size="19" font-weight="700" fill="#1B6F65" text-anchor="start">3. session</text><text x="898" y="150" font-size="16" fill="#33475B" text-anchor="start">oddjob-mkhomedir</text><text x="898" y="175" font-size="16" fill="#33475B" text-anchor="start">create /home/somsak</text><rect x="1160" y="90" width="210" height="110" rx="12" fill="#EAF6EE" stroke="#1E7D3A" stroke-width="2"/><text x="1178" y="122" font-size="19" font-weight="700" fill="#1E7D3A" text-anchor="start">4. sudo</text><text x="1178" y="150" font-size="16" fill="#33475B" text-anchor="start">sudo rules from IPA</text><text x="1178" y="175" font-size="16" fill="#33475B" text-anchor="start">web_nginx_ops</text><rect x="220" y="300" width="240" height="110" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="238" y="332" font-size="19" font-weight="700" fill="#C0392B" text-anchor="start">failure</text><text x="238" y="360" font-size="16" fill="#33475B" text-anchor="start">Failed password</text><text x="238" y="385" font-size="16" fill="#33475B" text-anchor="start">maxfail counted at IPA</text><rect x="530" y="300" width="240" height="110" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/><text x="548" y="332" font-size="19" font-weight="700" fill="#C0392B" text-anchor="start">refused</text><text x="548" y="360" font-size="16" fill="#33475B" text-anchor="start">pam_sss: Access denied</text><text x="548" y="385" font-size="16" fill="#33475B" text-anchor="start">right password, no permission</text></svg>
