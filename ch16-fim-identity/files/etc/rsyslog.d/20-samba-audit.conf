if $programname == 'smbd_audit' then {
    action(type="omfile" file="/var/log/smbd_audit.log")
    action(type="omfwd" target="192.168.10.20" port="1514" protocol="tcp"
           template="RSYSLOG_SyslogProtocol23Format"
           queue.type="LinkedList" queue.filename="graylog_smb" queue.maxDiskSpace="1g"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
    stop
}
