# EN: HTTPS inside the lab
# HTTPS ภายใน lab
server {
    listen 443 ssl;
    http2 on;
    server_name graylog-01.lab.internal;

    ssl_certificate     /etc/nginx/tls/graylog.crt;
    ssl_certificate_key /etc/nginx/tls/graylog.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Graylog-Server-URL https://$host/;
        proxy_pass http://graylog:9000;
    }
}

# EN: Reject unknown hostnames
# ปฏิเสธ hostname ที่ไม่รู้จัก
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}
