# EN: 30-protect-shadow.yaml : from chapter 19 (test with tetra tracingpolicy add before placing it in this directory)
# 30-protect-shadow.yaml : จากบทที่ 19 (ทดสอบด้วย tetra tracingpolicy add ก่อนวางในไดเรกทอรีนี้)
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "protect-shadow"
spec:
  kprobes:
  - call: "security_file_permission"
    syscall: false
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/etc/shadow"
        - "/etc/gshadow"
      matchNamespaces:
      - namespace: Pid
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      - action: Sigkill
